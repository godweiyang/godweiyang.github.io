<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LOL 作战数据舱</title>
<style>
:root{
  --bg0:#04060c;
  --cyan:#22d3ee; --blue:#38bdf8; --gold:#fbbf24; --green:#34d399;
  --orange:#fb923c; --red:#fb7185; --violet:#a78bfa;
  --txt:#dbe7ff; --sub:#8298bd; --weak:#5b6d8f;
  --panel:linear-gradient(160deg,rgba(22,33,58,.68),rgba(9,15,29,.52));
  --brd:rgba(96,168,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg0);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh;background:
  radial-gradient(1100px 620px at 12% -8%,rgba(34,211,238,.14),transparent 60%),
  radial-gradient(1000px 640px at 92% -4%,rgba(167,139,250,.16),transparent 60%),
  radial-gradient(900px 700px at 50% 118%,rgba(56,189,248,.10),transparent 62%),
  linear-gradient(180deg,#05080f,#04060c 60%)}
#bgFx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1580px;margin:0 auto;padding:22px 26px 40px}
header.hud{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:18px 22px;border-radius:18px;background:var(--panel);border:1px solid var(--brd);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 22px 60px rgba(0,0,0,.5);
  position:relative;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
header.hud::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.7;animation:sweep 4.2s linear infinite}
@keyframes sweep{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.avatar{width:64px;height:64px;border-radius:50%;border:2px solid rgba(56,189,248,.5);box-shadow:0 0 22px rgba(56,189,248,.35);background:#0b1426;object-fit:cover;flex:0 0 auto}
.hud-l{flex:1;min-width:240px}
.crumb{font-size:11.5px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.85}
.pname{font-size:32px;font-weight:800;letter-spacing:.5px;line-height:1.15;margin:6px 0 8px;
  background:linear-gradient(92deg,#fff,#bfe4ff 55%,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 26px rgba(56,189,248,.25)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid rgba(120,170,255,.22);background:rgba(56,189,248,.08);color:#bcd6f5;letter-spacing:.4px}
.chip b{color:#fff;font-weight:700}
.horse{position:relative;width:118px;height:118px;flex:0 0 auto;display:grid;place-items:center}
.horse .ring{position:absolute;inset:0;border-radius:50%}
.horse .core{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.16),rgba(12,20,38,.92));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 18px rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.4)}
.horse .hl{font-size:19px;font-weight:800;letter-spacing:1px;line-height:1.1}
.horse .hs{font-size:10px;color:var(--sub);margin-top:3px}
.horse .hscore{font-size:13px;font-weight:700;color:#fff}
.horse.T .ring{background:conic-gradient(from 0deg,#fbbf24,#fff6d5,#f59e0b,#fde68a,#fbbf24);animation:spin 3.6s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));filter:drop-shadow(0 0 10px rgba(251,191,36,.6))}
.horse.A .ring{background:conic-gradient(from 0deg,#34d399,#a7f3d0,#10b981,#34d399);opacity:.9;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.B .ring{background:conic-gradient(from 0deg,#38bdf8,#bae6fd,#0ea5e9,#38bdf8);opacity:.85;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.C .ring{background:conic-gradient(from 0deg,#fb923c,#fed7aa,#f97316,#fb923c);opacity:.8;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.D .ring{background:conic-gradient(from 0deg,#fb7185,#fecdd3,#e11d48,#fb7185);opacity:.8;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.N .ring{background:rgba(120,140,170,.35);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
@keyframes spin{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi{position:relative;padding:14px 14px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--brd);overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--c,var(--cyan)),transparent)}
.kpi .v{font-size:25px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600;margin-left:1px}
.kpi .l{font-size:11.5px;color:var(--sub);margin-top:7px;letter-spacing:.6px}
.kpi .spark{position:absolute;right:6px;bottom:6px;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.grid>*{min-width:0}
.panel{position:relative;border-radius:15px;background:var(--panel);border:1px solid var(--brd);padding:14px 16px 15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 18px 48px rgba(0,0,0,.42);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.panel .corner{position:absolute;width:12px;height:12px;border:0 solid var(--cyan);opacity:.55;pointer-events:none;z-index:3}
.panel .corner.tl{top:7px;left:7px;border-top-width:1.5px;border-left-width:1.5px;border-top-left-radius:4px}
.panel .corner.tr{top:7px;right:7px;border-top-width:1.5px;border-right-width:1.5px;border-top-right-radius:4px}
.panel .corner.bl{bottom:7px;left:7px;border-bottom-width:1.5px;border-left-width:1.5px;border-bottom-left-radius:4px}
.panel .corner.br{bottom:7px;right:7px;border-bottom-width:1.5px;border-right-width:1.5px;border-bottom-right-radius:4px}
.panel h3{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:#cfe3ff;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:4px;height:13px;border-radius:2px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan)}
.panel h3 .tag{margin-left:auto;font-size:10.5px;color:var(--weak);letter-spacing:.5px;font-weight:500;text-align:right}
.cv{min-width:0;overflow:hidden;position:relative;width:100%}
.cv canvas{display:block;width:100%}
.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
#archBox{margin-top:4px}
.arch-name{text-align:center;font-size:17px;font-weight:800;letter-spacing:1px;margin:2px 0 3px;
  background:linear-gradient(92deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.arch-desc{text-align:center;font-size:10.5px;color:var(--sub);margin-bottom:9px}
.trait{display:grid;grid-template-columns:64px 1fr 34px;gap:8px;align-items:center;font-size:11px;margin:5px 0}
.trait .tn{color:#cdddf7}.trait .tbar{height:6px;border-radius:4px;background:rgba(120,150,200,.13);overflow:hidden}
.trait .tbar i{display:block;height:100%;border-radius:4px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.trait .tv{text-align:right;color:#fff;font-variant-numeric:tabular-nums;font-weight:700}
.dual{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.rk{border-radius:11px;padding:10px 12px;border:1px solid rgba(120,170,255,.15);background:rgba(10,18,34,.5)}
.rk .rt{font-size:14px;font-weight:800;color:#eaf4ff}.rk .rs{font-size:10.5px;color:var(--sub);margin-top:3px}
.rk .rh{font-size:10.5px;margin-top:7px;padding-top:6px;border-top:1px dashed rgba(120,160,220,.18);color:var(--sub)}.rk .rh b{color:#cfe3ff;font-weight:700}
.rk.none .rt{color:var(--sub);font-weight:600;font-size:12.5px}
.rkhead{font-size:11px;letter-spacing:1px;color:var(--cyan);margin:2px 0 7px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.rc{border-radius:10px;padding:8px 11px;background:rgba(10,18,34,.5);border:1px solid rgba(120,170,255,.13)}
.rc .rv{font-size:18px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.rc .rv small{font-size:11px;color:var(--sub);font-weight:600}
.rc .rl{font-size:10.5px;color:var(--sub);margin-top:5px;letter-spacing:.3px}
#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(8,14,28,.95);border:1px solid rgba(56,189,248,.4);border-radius:10px;padding:9px 11px;font-size:11.5px;box-shadow:0 12px 34px rgba(0,0,0,.6),0 0 18px rgba(56,189,248,.15);max-width:250px;line-height:1.6;backdrop-filter:blur(6px)}
#tip b{color:#fff}#tip .g{color:var(--gold)}#tip .c{color:var(--cyan)}
.empty{margin:14vh auto;max-width:440px;text-align:center;border:1px dashed rgba(120,160,220,.3);border-radius:16px;padding:40px 26px;background:rgba(12,20,38,.4)}
.empty h2{font-size:20px;margin-bottom:10px;color:#e6f1ff}.empty p{color:var(--sub);font-size:13px;line-height:1.8}
.empty a{display:inline-block;margin-top:16px;padding:9px 20px;border-radius:10px;background:linear-gradient(120deg,var(--cyan),var(--blue));color:#04121f;font-weight:700;text-decoration:none}
footer{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--weak);font-size:11px;letter-spacing:.5px;padding:0 4px}
footer a{color:var(--cyan);text-decoration:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.wrap{padding:14px 12px 30px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.col-4,.col-5,.col-7,.col-8,.col-12{grid-column:span 2}.dual{grid-template-columns:1fr}.pname{font-size:25px}.horse{width:96px;height:96px}.horse .core{width:72px;height:72px}}
</style>
</head>
<body>
<canvas id="bgFx"></canvas>
<div class="wrap" id="app"></div>
<div id="tip"></div>
<script>
"use strict";
const KEY='lol_arena_payload';
function readPayload(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}
const P=readPayload();
const HCOL={T:'#fbbf24',A:'#34d399',B:'#38bdf8',C:'#fb923c',D:'#fb7185',N:'#64748b'};
const HNAME={T:'天选马',A:'上等马',B:'中等马',C:'下等马',D:'没有马',N:'暂无评级'};
const POSCOL={'上':'#fb7185','野':'#34d399','中':'#38bdf8','下':'#fbbf24','射':'#fbbf24','辅':'#a78bfa','助':'#a78bfa'};
const posColor=cn=>{const s=String(cn||'');for(const k in POSCOL){if(s.indexOf(k)>=0)return POSCOL[k];}return '#94a3b8';};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp1=(v,lo,hi)=>hi>lo?clamp((v-lo)/(hi-lo),0,1):0;
const easeOut=t=>1-Math.pow(1-t,3);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))));};
function linReg(ys){const n=ys.length;if(n<2)return 0;const mx=(n-1)/2,my=mean(ys);let num=0,den=0;ys.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)*(i-mx);});return den?num/den:0;}
function smooth(arr,w){return arr.map((_,i)=>mean(arr.slice(Math.max(0,i-w+1),i+1)));}
const num=v=>{v=Number(v);return isFinite(v)?v:0;};
const fmtK=n=>n>=10000?(n/1000).toFixed(1)+'k':Math.round(n).toLocaleString('en-US');
const fmtDur=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const pct=(v,d=0)=>(v*100).toFixed(d)+'%';
const dateOf=ts=>{const d=new Date(ts);return isNaN(d)?null:d;};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

if(!P){document.getElementById('app').innerHTML='<div class="empty"><h2>暂无作战数据</h2><p>请先在 LOL 战绩查询的「单人查询」里搜索召唤师，再点击顶部的 <b>⚡数据大屏</b> 按钮进入本页。</p><a href="/lol/#/single">返回查询页</a></div>';}
else{
const M=P.matches||[],N=M.length,R=P.R||N;
const s=P.summary||{};
const S=k=>num(s[k]);
const kda=S('averageKda'),wr=S('winRate'),kp=S('averageKillParticipationRate'),cspm=S('averageCsPerMinute');
const dmgShare=S('averageDamageDealtToChampionShareOfTeam'),dmgToTop=S('averageDamageDealtToChampionShareToTop');
const takenShare=S('averageDamageTakenShareOfTeam'),goldShare=S('averageGoldShareOfTeam'),csShare=S('averageCsShareOfTeam');
const DPR=Math.min(window.devicePixelRatio||1,2);
const winOf=g=>!!g.win;
const winsN=M.filter(winOf).length;

/* ===== 派生统计 ===== */
const kdaArr=M.map(g=>g.kda),kdaStd=std(kdaArr);
const fbRate=N?M.filter(g=>g.fb).length/N:0;
const multiRate=N?M.filter(g=>g.penta+g.quadra+g.triple>0).length/N:0;
const hotRate=N?M.filter(g=>g.kda>=4).length/N:0;
const hcnt={T:0,A:0,B:0,C:0,D:0,N:0};M.forEach(g=>{hcnt[g.horse&&g.horse.tier]=(hcnt[g.horse&&g.horse.tier]||0)+1;});
const trans={};let selfLoop=0,transTot=0;
for(let i=1;i<M.length;i++){const a=M[i-1].horse&&M[i-1].horse.tier,b=M[i].horse&&M[i].horse.tier;if(!a||!b)continue;trans[a]=trans[a]||{};trans[a][b]=(trans[a][b]||0)+1;transTot++;if(a===b)selfLoop++;}
const selfLoopRate=transTot?selfLoop/transTot:0;
const w=Math.max(3,Math.round(N/8)||3);
const trendSlope=linReg(smooth(kdaArr,w)),trendNorm=lerp1(trendSlope,-0.3,0.3);

/* ===== 英雄聚合（补 KDA / 场均伤害 / 主位置） ===== */
const agg={};M.forEach(g=>{const k=String(g.cid??g.cn);if(!agg[k])agg[k]={k:0,d:0,a:0,dmg:0,n:0,win:0,pos:{}};const t=agg[k];t.k+=g.k;t.d+=g.d;t.a+=g.a;t.dmg+=g.dmg;t.n++;if(g.win)t.win++;if(g.posCn)t.pos[g.posCn]=(t.pos[g.posCn]||0)+1;});
const champMap={};(P.champs||[]).forEach(c=>{champMap[String(c.id)]=c;});
const champs=(P.champs||[]).map(c=>{const t=agg[String(c.id)]||{k:0,d:0,a:0,dmg:0,n:0,pos:{}};const pos=Object.entries(t.pos).sort((a,b)=>b[1]-a[1])[0];
  const cd=t.d>0?(t.k+t.a)/t.d:(t.k+t.a);
  return {cn:c.cn,icon:c.icon,count:c.count,wr:c.wr,kda:t.n?cd:0,dpg:t.n?t.dmg/t.n:0,pos:pos?pos[0]:(c.cn?'':''),n:t.n};}).filter(c=>c.count>0).slice(0,24);

/* ===== 风格六维 + 原型 ===== */
const TRAITS=[
 {k:'carry',n:'输出压制',v:clamp(.38*lerp1(kda,1,5)+.34*lerp1(dmgShare,.15,.38)+.28*lerp1(dmgToTop,.4,1.05),0,1)},
 {k:'farm',n:'发育能力',v:clamp(.5*lerp1(cspm,3,9)+.28*lerp1(csShare,.12,.3)+.22*lerp1(goldShare,.15,.28),0,1)},
 {k:'team',n:'参团节奏',v:clamp(.6*lerp1(kp,.3,.78)+.4*lerp1(wr,.35,.72),0,1)},
 {k:'tank',n:'前排承伤',v:clamp(lerp1(takenShare,.14,.38),0,1)},
 {k:'burst',n:'爆发多杀',v:clamp(.5*lerp1(multiRate,0,.35)+.3*lerp1(fbRate,0,.35)+.2*lerp1(hotRate,0,.4),0,1)},
 {k:'cons',n:'稳定掌控',v:clamp(.4*(1-lerp1(kdaStd,1,4))+.3*selfLoopRate+.3*trendNorm,0,1)}
];
const ARCH={carry:['团战大核','队伍的输出天花板，伤害与击杀都由你兜底'],farm:['发育大核','埋头发育后期接管比赛，装备成型即无敌'],team:['节奏发动机','参团率拉满的团队粘合剂，节奏由你发起'],tank:['前排壁垒','冲在最前承伤开路，队友最安心的铜墙铁壁'],burst:['瞬间爆发','一血与多杀常客，出手就是瞬秒的刺客'],cons:['稳定基石','状态几乎不跳水，队伍最可靠的基本盘']};
(function(){const sorted=[...TRAITS].sort((a,b)=>b.v-a.v);let arch=ARCH[sorted[0].k];
 if(sorted[0].v>0.62&&sorted[1].v>0.58&&sorted.filter(t=>t.v>0.5).length>=4)arch=['六边形战士','没有明显短板的全能型选手，攻守兼备'];
 window.__ARCH=arch;window.__TRAITS=TRAITS;})();

/* ===== 发力期分桶 ===== */
function bucket(dur){if(dur<22*60)return 0;if(dur<=30*60)return 1;return 2;}
const phases=[{n:'前期',g:[]},{n:'中期',g:[]},{n:'后期',g:[]}];
M.forEach(g=>phases[bucket(g.dur)].g.push(g));
const phaseStat=phases.map(p=>{const n=p.g.length;return{n:p.n,cnt:n,wr:n?p.g.filter(winOf).length/n:0,kda:n?mean(p.g.map(x=>x.kda)):0,cspm:n?mean(p.g.map(x=>x.cspm)):0};});

/* ===== 伤害构成 ===== */
let phy=0,mag=0,tru=0,totDmg=0,totTaken=0,totGold=0;M.forEach(g=>{phy+=g.phy;mag+=g.mag;tru+=g.tru;totDmg+=g.dmg;totTaken+=g.taken;totGold+=g.gold;});
const dmgTrip=[{n:'物理',v:phy,c:'#fb923c'},{n:'魔法',v:mag,c:'#a78bfa'},{n:'真实',v:tru,c:'#e5e7eb'}];
const dmgTot=phy+mag+tru||1;
const convert=totGold?totDmg/totGold:0;

/* ===== 战局类型 ===== */
const GTYPE=[{n:'碾压局',c:'#fbbf24',f:g=>g.win&&(g.kda>=4||g.dur<22*60)},
 {n:'翻盘局',c:'#c084fc',f:g=>g.win&&g.dur>=30*60&&g.kda<4},
 {n:'稳健局',c:'#34d399',f:g=>g.win&&!(g.kda>=4||g.dur<22*60)&&!(g.dur>=30*60&&g.kda<4)},
 {n:'尽力局',c:'#38bdf8',f:g=>!g.win&&g.kda>=2.5},
 {n:'投降局',c:'#94a3b8',f:g=>!g.win&&g.surrender&&g.kda<2.5},
 {n:'落败局',c:'#fb7185',f:g=>!g.win&&!g.surrender&&g.kda<2.5}];
const gtypeCnt=GTYPE.map(t=>({n:t.n,c:t.c,v:M.filter(t.f).length}));

/* ===== 连胜/连败/极值 ===== */

  // 胜率内弧
  ctx.beginPath();ctx.arc(cx,cy,R*0.22*pp,a0,a0+span);ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.globalAlpha=.5+0.5*x.wr;ctx.stroke();ctx.globalAlpha=1;
  const mid=a0+span/2,lx=cx+Math.cos(mid)*(rr+14),ly=cy+Math.sin(mid)*(rr+14);
  ctx.fillStyle='#eaf4ff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(x.cn||x.pos,lx,ly-5);ctx.fillStyle=col;ctx.font='9px sans-serif';ctx.fillText(x.count+'场 '+pct(x.wr,0),lx,ly+7);
  a0+=span+gap;});
 ctx.fillStyle='#7e93b5';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('内环亮度=胜率',cx,h-12);});

/* 9) 伤害构成复合环 + 中心转化率 */
setupCanvas('cvDmg',(ctx,w,h,p)=>{const cx=w/2,cy=h/2-10,R=Math.min(w,h)/2-58,rIn=R*0.58,pp=easeOut(p);
 let a0=-Math.PI/2;
 dmgTrip.forEach(t=>{const frac=t.v/dmgTot,span=frac*Math.PI*2*pp;
  ctx.beginPath();ctx.arc(cx,cy,R,a0,a0+span);ctx.arc(cx,cy,rIn,a0+span,a0,true);ctx.closePath();ctx.fillStyle=t.c+Math.round(150+80*frac).toString(16).padStart(2,'0');ctx.shadowColor=t.c;ctx.shadowBlur=6;ctx.fill();ctx.shadowBlur=0;
  const mid=a0+span/2;if(frac>0.05){ctx.fillStyle='#0b1426';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pct(frac,0),cx+Math.cos(mid)*(R*0.82),cy+Math.sin(mid)*(R*0.82));
   ctx.fillStyle=t.c;ctx.font='10.5px sans-serif';ctx.fillText(t.n,cx+Math.cos(mid)*(R+16),cy+Math.sin(mid)*(R+16));}
  a0+=span;});
 // 中心转化
 ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pct(convert,0),cx,cy-6);
 ctx.fillStyle='#8298bd';ctx.font='9.5px sans-serif';ctx.fillText('伤害/经济 转化',cx,cy+14);
 ctx.fillStyle='#7e93b5';ctx.font='9.5px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('场均伤害 '+fmtK(N?totDmg/N:0)+' · 场均承伤 '+fmtK(N?totTaken/N:0),cx,h-12);});

/* 10) 战局类型 donut */
setupCanvas('cvType',(ctx,w,h,p)=>{const cx=w/2,cy=h/2-14,R=Math.min(w,h)/2-66,rIn=R*0.6,pp=easeOut(p);const tot=gtypeCnt.reduce((s,t)=>s+t.v,0)||1;
 let a0=-Math.PI/2;
 gtypeCnt.forEach(t=>{if(!t.v)return;const span=t.v/tot*Math.PI*2*pp;
  ctx.beginPath();ctx.arc(cx,cy,R,a0,a0+span);ctx.arc(cx,cy,rIn,a0+span,a0,true);ctx.closePath();ctx.fillStyle=t.c+'d9';ctx.strokeStyle='rgba(4,6,12,.8)';ctx.lineWidth=1.5;ctx.fill();ctx.stroke();
  const mid=a0+span/2;if(t.v/tot>0.06){ctx.fillStyle='#0b1426';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.v,cx+Math.cos(mid)*(R*0.82),cy+Math.sin(mid)*(R*0.82));}
  a0+=span;});
 ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(N,cx,cy-6);ctx.fillStyle='#8298bd';ctx.font='9.5px sans-serif';ctx.fillText('总对局',cx,cy+14);
 // 图例
 let ly=h-84;ctx.textAlign='left';gtypeCnt.forEach(t=>{const lx=cx-R;ctx.fillStyle=t.c;ctx.fillRect(lx,ly-4.5,9,9);ctx.fillStyle='#cdddf7';ctx.font='9.5px sans-serif';ctx.textBaseline='middle';ctx.fillText(t.n+' '+t.v+'（'+pct(t.v/(tot||1),0)+'）',lx+14,ly);ly+=13;});});

/* ===== 背景粒子 ===== */
const bg=document.getElementById('bgFx'),bctx=bg.getContext('2d');let bpts=[];
function bgSize(){bg.width=innerWidth*DPR;bg.height=innerHeight*DPR;bg.style.width=innerWidth+'px';bg.style.height=innerHeight+'px';bctx.setTransform(DPR,0,0,DPR,0,0);
 const n=Math.min(70,Math.floor(innerWidth*innerHeight/26000));bpts=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22}));}
function bgDraw(){const W=innerWidth,H=innerHeight;bctx.clearRect(0,0,W,H);
 bpts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<0||pt.x>W)pt.vx*=-1;if(pt.y<0||pt.y>H)pt.vy*=-1;});
 for(let i=0;i<bpts.length;i++)for(let j=i+1;j<bpts.length;j++){const a=bpts[i],b=bpts[j],dx=a.x-b.x,dy=a.y-b.y,dd=dx*dx+dy*dy;if(dd<130*130){bctx.strokeStyle='rgba(56,189,248,'+(0.08*(1-Math.sqrt(dd)/130))+')';bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(b.x,b.y);bctx.stroke();}}
 bpts.forEach(pt=>{bctx.fillStyle='rgba(120,200,255,.5)';bctx.beginPath();bctx.arc(pt.x,pt.y,1.3,0,7);bctx.fill();});requestAnimationFrame(bgDraw);}

/* ===== 静态面板动画 ===== */
const T0=performance.now(),DUR=1300;
function frame(t){const p=clamp((t-T0)/DUR,0,1);drawers.forEach(o=>o.render(p));if(p<1)requestAnimationFrame(frame);}
window.addEventListener('resize',()=>{bgSize();drawers.forEach(o=>o.render(1));});
bgSize();bgDraw();requestAnimationFrame(frame);
}
</script>
