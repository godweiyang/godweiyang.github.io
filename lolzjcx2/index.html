<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOL 战绩详情</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1f2329;--sub:#6b7280;--line:#e3e7ee;--blue:#2563eb;--pri:#5b2a86;--red:#dc2626;--org:#d97706;--green:#16a34a;--win:#16a34a;--lose:#dc2626;--blueSide:#2f6fd0;--redSide:#d04545;--code:#0f172a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-user-select:text;user-select:text}
html,body,div,span,p,b,td,th,label,h1,h2,h3,li,code{--webkit-user-select:text;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{-webkit-user-select:none;user-select:none}
img{display:block}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
@media(min-width:1700px){.wrap{max-width:1560px}}
/* 顶部服务栏 */
header.top{background:linear-gradient(135deg,#3a1d5e,#5b2a86);color:#fff;border-radius:14px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:9px}
header.top h1{font-size:19px;margin:0;letter-spacing:2px;text-align:center}
.svcbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
.svc{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;gap:6px}
.svc i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block}
.svc.on{background:rgba(255,255,255,.2)}.svc.on i{background:#4ade80;box-shadow:0 0 6px #4ade80}
.svc-tip{font-size:12px;color:rgba(255,255,255,.85)}
.svc-dl{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c3aed,#9a6dd7);padding:4px 13px;border-radius:999px;text-decoration:none;white-space:nowrap}
.svc-dl:hover{filter:brightness(1.08)}
.svc-opt{font-size:12px;color:rgba(255,255,255,.9);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.svc-b{background:transparent!important;border:1px solid rgba(255,255,255,.55)!important;color:rgba(255,255,255,.92)!important;font-weight:400}
.svc-b.primary{background:var(--pri)!important;border-color:var(--pri)!important;color:#fff!important;font-weight:700}
.svc-b.warn{background:#f59e0b!important;border-color:#f59e0b!important;color:#fff!important;font-weight:700}
.svc-path{flex-basis:100%;text-align:center;font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.svc-macsh{flex-basis:100%;display:none;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:11px;color:rgba(255,255,255,.8)}
.svc-macsh code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.13);border-radius:6px;padding:2px 8px;font-size:11px;color:#fff;word-break:break-all;text-align:left;line-height:1.5}
.svc-macsh button{font-size:11px;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:2px 10px;cursor:pointer}
a.svc-dis{opacity:.5;pointer-events:none}
.svc-stop{font-size:12px;font-weight:700;color:#fff;background:rgba(220,38,38,.85);padding:4px 13px;border-radius:999px;white-space:nowrap;border:0}
.svc-stop:hover{background:rgba(220,38,38,1)}
.navlink{font-size:12px;color:rgba(255,255,255,.85);text-decoration:underline;white-space:nowrap}
.pool-btn{background:rgba(255,255,255,.16);color:#fff;font-size:12px;font-weight:700;padding:4px 13px;border-radius:999px;white-space:nowrap;border:0;cursor:pointer}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:12px}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;background:var(--blue);color:#fff}
button.sec{background:#efeaf7;color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
/* 搜索 */
.search-row{display:flex;gap:8px}
.search-row input{flex:1;min-width:0;font-size:16px}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast div{padding:9px 14px;border-radius:8px;color:#fff;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.t-e{background:var(--red)}.t-s{background:var(--green)}.t-w{background:var(--org)}
/* 玩家头部 */
.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:14px;border:1px solid var(--line);background:#f3f4f6;flex:0 0 auto}
.pf-main{flex:1;min-width:220px}
.pf-name{font-size:21px;font-weight:800;line-height:1.25;word-break:break-word}
.pf-name .tag{color:var(--sub);font-weight:600;font-size:15px}
.pf-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--sub);align-items:center}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3}
.pill.priv{background:#fdecec;color:var(--red)}
.exp{margin-top:8px;max-width:340px}
.exp .bar{height:8px;background:#eef0f4;border-radius:999px;overflow:hidden}
.exp .bar i{display:block;height:100%;background:linear-gradient(90deg,#5b2a86,#9a6dd7)}
.exp .lab{font-size:11px;color:var(--sub);margin-top:3px}
/* 段位卡 */
.ranks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rank-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:linear-gradient(180deg,#fbfaff,#fff)}
.rc-head{display:flex;align-items:center;gap:10px}
.rc-emblem{width:46px;height:46px;flex:0 0 auto}
.rc-tier{font-size:16px;font-weight:800;line-height:1.2}
.rc-queue{font-size:12px;color:var(--sub)}
.rc-lp{font-size:12px;color:var(--org);font-weight:700;margin-top:2px}
.rc-rows{margin-top:9px;font-size:12px;line-height:1.85;border-top:1px dashed var(--line);padding-top:7px}
.rc-rows .rk{color:var(--sub);display:inline-block;min-width:74px}
.rc-unranked{color:var(--sub);font-size:13px}
/* 数据总览 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat-box{background:#f8f6fc;border-radius:10px;padding:10px 12px}
.stat-box .v{font-size:20px;font-weight:800;color:var(--pri)}
.stat-box .l{font-size:11.5px;color:var(--sub);margin-top:2px}
.share-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.share-tbl td{padding:5px 6px;border-bottom:1px solid #f0eef6}
.share-tbl .lab{white-space:nowrap;color:var(--ink);width:96px}
.share-tbl .pct{width:52px;text-align:right;font-variant-numeric:tabular-nums}
.meter{flex:1;height:9px;max-height:9px;background:#eef0f4;border-radius:999px;overflow:hidden;min-width:60px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.meter.team i{background:linear-gradient(90deg,#7c3aed,#9a6dd7)}
.meter.top i{background:linear-gradient(90deg,#2563eb,#60a5fa)}
.meter-row{display:flex;align-items:center;gap:7px}
.dmg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;font-size:11.5px}
.dmg3 .c{background:#f8f6fc;border-radius:8px;padding:6px 9px;text-align:center}
.dmg3 .c b{display:block;font-size:14px}
.dmg3 .phy b{color:#d97706}.dmg3 .mag b{color:#2563eb}.dmg3 .tru b{color:#16a34a}
/* 分路 & 英雄池 */
.two-col{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.pos-list,.champ-list{display:flex;flex-direction:column;gap:8px}
.pos-item,.champ-item{display:flex;align-items:center;gap:9px;font-size:12.5px}
.pos-item .nm,.champ-item .nm{width:52px;flex:0 0 auto;font-weight:600}
.champ-item .nm{width:auto;min-width:64px}
.champ-item img,.mini-champ{width:34px;height:34px;border-radius:8px;flex:0 0 auto;background:#f3f4f6}
.champ-item .info{flex:1;min-width:0}
.champ-item .top{display:flex;justify-content:space-between;gap:6px}
.winbar{height:6px;background:#fdecec;border-radius:999px;overflow:hidden;margin-top:3px}
.winbar i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#4ade80)}
.pos-item .meter{max-width:120px}
/* 开黑队友 */
.mate-list{display:flex;flex-direction:column;gap:7px}
.mate{display:flex;align-items:center;gap:9px;font-size:12.5px}
.mate img{width:30px;height:30px;border-radius:8px;background:#f3f4f6;flex:0 0 auto}
.mate .mn{font-weight:600;min-width:150px}
.mate .mc{color:var(--sub)}
/* 模式 tab */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#f1f2f6;color:var(--ink);font-weight:600;font-size:12.5px;padding:6px 13px;border-radius:999px}
.tabs button.on{background:var(--pri);color:#fff}
/* 战绩行 */
.match{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;background:#fff}
.m-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer}
.m-row:hover{background:#faf9fd}
.m-res{flex:0 0 46px;text-align:center;font-weight:800;font-size:13px;border-radius:8px;padding:14px 0;color:#fff;line-height:1.2}
.m-res.win{background:var(--win)}.m-res.lose{background:var(--lose)}.m-res.remake{background:#9ca3af}
.m-champ{display:flex;align-items:center;gap:8px;flex:0 0 150px;min-width:0}
.m-champ img{width:40px;height:40px;border-radius:9px}
.m-champ .cn{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-champ .sub{font-size:11px;color:var(--sub)}
.m-kda{flex:0 0 120px;text-align:center;font-weight:800;font-size:15px}
.m-kda .kk{color:var(--green)}.m-kda .dd{color:var(--red)}.m-kda .aa{color:#111827}.m-kda .sep{color:var(--sub);font-weight:400}
.m-kda .ratio{font-size:11px;color:var(--sub);font-weight:600}
.m-horse{display:inline-block;margin-left:5px;font-size:10px;font-weight:800;border-radius:5px;padding:0 5px;line-height:16px}
.m-horse.h-A{background:#e8f7ee;color:#16a34a}.m-horse.h-B{background:#e8f0fe;color:#2563eb}.m-horse.h-C{background:#fdf1e2;color:#ea8a16}.m-horse.h-D{background:#fdecec;color:#dc2626}
.m-icons{flex:0 0 auto;display:flex;gap:3px;align-items:center}
.m-icons img{width:22px;height:22px;border-radius:5px}
.m-items{flex:1;display:flex;gap:3px;justify-content:flex-end;min-width:0;overflow:hidden}
.m-items .slot{width:24px;height:24px;border-radius:5px;background:#f3f4f6;flex:0 0 auto}
.m-items img{width:24px;height:24px;border-radius:5px}
.m-info{flex:0 0 132px;font-size:11.5px;color:var(--sub);line-height:1.5;text-align:right}
.m-detail{display:none;border-top:1px solid var(--line);background:#fbfafd}
.match.open .m-detail{display:block}
.team{padding:8px 12px}
.team.t100{background:#f4f8ff}.team.t200{background:#fff6f6}
.team-head{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;padding:4px 0 7px;flex-wrap:wrap}
.team-head .side{padding:2px 9px;border-radius:6px;color:#fff}
.team.t100 .side{background:var(--blueSide)}.team.t200 .side{background:var(--redSide)}
.team-head .res{font-weight:800}
.team.t100 .res.win,.team.t200 .res.win{color:var(--green)}
.team.t100 .res.lose,.team.t200 .res.lose{color:var(--red)}
.obj{display:inline-flex;align-items:center;gap:3px;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:#374151;font-weight:600}
.bans{display:inline-flex;gap:3px;align-items:center}
.bans img{width:20px;height:20px;border-radius:4px}
.bans .slot{width:20px;height:20px;border-radius:4px;background:#e5e7eb;display:block}
.bans .lab{font-size:11px;color:var(--sub);margin-right:2px}
.pl{display:grid;grid-template-columns:24px 30px minmax(120px,1.4fr) repeat(6,minmax(48px,.7fr)) 86px minmax(150px,1fr);gap:6px;align-items:center;padding:5px 2px;font-size:11.5px;border-top:1px solid #f1f0f6}
.pl.hl{background:#f1ecfb;border-radius:6px}
.pl img.c{width:26px;height:26px;border-radius:6px}
.pl .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pname .t{color:var(--sub);font-weight:400}
.pl .num{text-align:right;font-variant-numeric:tabular-nums}
.pl .pk{color:var(--green);font-weight:700}.pl .pd{color:var(--red);font-weight:700}
.pl .picons{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.pl .picons img{width:18px;height:18px;border-radius:4px}
.pl .pitems{display:flex;gap:2px;align-items:center;justify-content:flex-end}
.pl .pitems img{width:19px;height:19px;border-radius:4px}
.pl .pitems .slot{width:19px;height:19px;border-radius:4px;background:#eceef2}
.pl-head{font-size:10.5px;color:var(--sub);font-weight:600}
.pl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pl{min-width:850px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.pager .pg{font-size:13px;color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:13px}
.loading{color:var(--sub);text-align:center;padding:24px 0;font-size:13px}
.hint{font-size:11.5px;color:var(--sub);margin-top:6px}
@media (max-width:820px){
  .ranks{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{max-width:100%;padding:10px 8px 46px}
  header.top{padding:12px 11px;border-radius:12px}
  header.top h1{font-size:17px;letter-spacing:1px}
  .card{padding:12px 11px;margin:11px 0;border-radius:11px}
  .card h2{font-size:14px;flex-wrap:wrap}
  input,textarea{font-size:16px}
  .avatar{width:60px;height:60px}
  .pf-name{font-size:18px}
  /* 战绩行：紧凑两排，装备/信息收进展开详情 */
  .m-row{flex-wrap:wrap;gap:7px}
  .m-champ{flex:1 1 130px}
  .m-kda{flex:0 0 100px;order:3;text-align:left}
  .m-info{order:4;flex:1;text-align:left}
  .m-items{order:5;flex:1 1 100%;justify-content:flex-start;flex-wrap:nowrap}
  .m-icons{order:6}
  /* 10 人详情：改为可横向滑动，避免挤压 */
  .pl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pl{min-width:790px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .dmg3{grid-template-columns:1fr}
  .toast{left:12px;right:12px;bottom:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>LOL 战绩详情</h1>
    <div class="svcbar">
      <span class="svc" id="svcPill"><i></i><span id="svcText">检测中…</span></span>
      <a class="svc-dl" id="launchBtn" href="lolzjcx://start" style="display:none" title="浏览器若询问是否打开，选允许">启动服务</a>
      <button class="svc-stop" id="stopSvc" style="display:none">停止服务</button>
      <a class="svc-dl svc-b" id="dlBtn" href="/medias/files/lolzjcx_service.exe" download>下载本地服务</a>
      <label id="autoStopWrap" class="svc-opt" style="display:none"><input type="checkbox" id="autoStopChk" checked>关闭页面后自动停</label>
      <button type="button" class="pool-btn" id="poolBtn">积分/账号池</button>
      <a class="navlink" href="/lolzjcx/">多人对比</a>
      <span class="svc-tip" id="svcTip" style="display:none"></span>
      <span class="svc-path" id="svcPath" style="display:none"></span>
      <span class="svc-macsh" id="macShWrap">
        <span>免安全提示安装：打开「终端」粘贴执行一行命令</span>
        <code id="macShCmd">curl -fsSL https://godweiyang.com/medias/files/install_mac.sh | bash</code>
        <button type="button" id="macShCopy">复制命令</button>
      </span>
    </div>
  </header>

  <!-- 查询 -->
  <div class="card">
    <h2>召唤师查询（单人完整详情）</h2>
    <div class="search-row">
      <input id="qInput" placeholder="输入 召唤师名字#尾标，例如 godweiyang#23456" autocomplete="off">
      <button id="qBtn">查询</button>
    </div>
    <div class="hint">展示段位、近期数据、分路/英雄池、常排队友与近 15 场完整对局（点击对局展开双方 10 人详情）；完整查询 1 人消耗 3 积分，切换模式或翻页每次仅消耗 1 积分。</div>
  </div>

  <div id="root"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/lolzjcx2/pool.js"></script>
<script>
/* ============================================================
 * 本机后台服务：http://127.0.0.1:17530（探测/启停/下载，与 lolzjcx 同一套）
 * ============================================================ */
const API='http://127.0.0.1:17530';
const $=id=>document.getElementById(id);
async function rawFetch(path,opt,timeout=20000){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),timeout);
  try{return await fetch(API+path,Object.assign({signal:ctrl.signal},opt));}
  finally{clearTimeout(to);}
}
async function api(name,body,timeout=30000){
  let resp;
  try{resp=await rawFetch('/api/'+name,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})},timeout);}
  catch(e){setConnected(false);throw new Error('本地服务未连接，请先启动本地服务');}
  if(!resp.ok)throw new Error('本地服务返回 '+resp.status);
  const r=await resp.json();setConnected(true);
  if(!r.ok)throw new Error(r.error||'操作失败');
  return r.data;
}
let online=null,inited=false,svcVer='',svcPath='',forceDl=false,launchWatch=null;
const LATEST_VERSION='1.5.0';
const UA=(navigator.userAgent||'')+' '+(navigator.platform||'');
const IS_MAC=/macintosh|mac os x|iphone|ipad|ipod/i.test(UA);
const IS_ANDROID=/android/i.test(UA);
const DL_URL=IS_MAC?'/medias/files/lolzjcx_service_mac.zip':(IS_ANDROID?'/medias/files/lolzjcx_service_android.apk':'/medias/files/lolzjcx_service.exe');
const PTAG=IS_MAC?'Mac':(IS_ANDROID?'安卓':'Windows');
const L_DL=`下载本地服务（${PTAG}）`,L_FIRST=`下载本地服务（${PTAG}·首次使用）`,L_REDL=`重新下载本地服务（${PTAG}）`;
const L_UP_NOVER='更新本地服务（版本过旧）',L_UP=(o,n)=>`更新本地服务 v${o}→v${n}`;
const TIP_FIRST=IS_MAC?'推荐用下方终端命令一键安装（免 Gatekeeper 安全提示）；也可下载解压后右键→打开 App 一次'
  :IS_ANDROID?'下载 APK 安装（需允许“安装未知来源应用”），打开 App 点一次「启动服务」；以后直接点网页「启动服务」'
  :'下载后双击运行一次，以后直接点「启动服务」';
const TIP_RETRY=IS_MAC?'没启动起来？重跑下方终端命令，或下载解压后双击 App 运行一次'
  :IS_ANDROID?'没启动起来？打开已安装的 App 点「启动服务」即可':'没启动起来？下载后双击运行一次即可';
const TIP_UPDATE=IS_MAC?'推荐重跑下方终端命令自动更新（免安全提示）；或下载解压后右键→打开 App'

  for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=pa[i]||0,y=pb[i]||0;if(x!==y)return x<y?-1:1;}return 0;}

    dl.textContent=L_DL;setTip('');setPath('');aw.style.display='none';macCmd(true);return;}

    launch.style.display='none';stop.style.display='';aw.style.display='';

function rankRows(q,arena){
  const placed=q.tier&&!['NONE','UNRANKED'].includes(String(q.tier).toUpperCase());
  const prov=(q.provisionalGameThreshold>0&&(q.provisionalGamesRemaining??0)>0);
  const tr=(t,r)=>{const x=tierRank(t,r,arena);return x?`<b style="color:${arena?'#7c3aed':tierColor(t)}">${esc(x)}</b>`:'<span class="muted">—</span>';};
  if(!placed&&!prov)return '<div class="rc-unranked">未定级</div>';
  if(prov){const done=q.provisionalGameThreshold-q.provisionalGamesRemaining;
    return `<div class="rc-rows"><div>定级赛 <b>${done}/${q.provisionalGameThreshold}</b></div>
      <div><span class="rk">上赛季结算</span>${tr(q.previousSeasonEndTier,q.previousSeasonEndRank)}</div></div>`;}
  const total=(q.wins||0)+(q.losses||0),wr=total?Math.round(100*q.wins/total):null;
  let rows=`<div class="rc-rows">`;
  if(!arena||total>0)rows+=`<div><span class="rk">战绩</span>${q.wins||0}胜 ${q.losses||0}负${wr!=null?` · 胜率 ${wr}%`:''}</div>`;
  rows+=`<div><span class="rk">本赛季最高</span>${tr(q.highestTier,q.highestRank)}</div>`;
  if(!arena){
    rows+=`<div><span class="rk">上赛季结算</span>${tr(q.previousSeasonEndTier,q.previousSeasonEndRank)}</div>`;
    rows+=`<div><span class="rk">上赛季最高</span>${tr(q.previousSeasonHighestTier,q.previousSeasonHighestRank)}</div>`;
  }
  rows+=`</div>`;
  return rows;
}

      <div class="stat-box"><div class="v" style="color:var(--green)">${s.win}胜 ${s.lose}负</div><div class="l">胜率 ${pct(s.winRate)}</div></div>
      <div class="stat-box"><div class="v">${(s.averageKda??0).toFixed(2)}</div><div class="l">场均 KDA</div></div>
      <div class="stat-box"><div class="v">${pct(s.averageKillParticipationRate,1)}</div><div class="l">场均参团率</div></div>
      <div class="stat-box"><div class="v">${(s.averageCsPerMinute??0).toFixed(1)}</div><div class="l">分均补刀</div></div>
      <div class="stat-box"><div class="v" style="color:var(--org)">${streak}</div><div class="l">连胜 / 连败</div></div>
    </div>
    <table class="share-tbl">
      <tr><td class="lab muted">数据占比</td><td class="muted" style="font-size:11px">团队占比</td><td class="muted" style="font-size:11px">对位/全场最高</td></tr>
      ${shareRow('英雄伤害',s.averageDamageDealtToChampionShareOfTeam,s.averageDamageDealtToChampionShareToTop)}
      ${shareRow('总伤害',s.averageDamageShareOfTeam,s.averageDamageShareToTop)}
      ${shareRow('承受伤害',s.averageDamageTakenShareOfTeam,s.averageDamageTakenShareToTop)}
      ${shareRow('经济',s.averageGoldShareOfTeam,s.averageGoldShareToTop)}
      ${shareRow('补刀',s.averageCsShareOfTeam,s.averageCsShareToTop)}
    </table>
    <div class="dmg3">
      ${d3('物理伤害·团队','phy','averagePhysicalDamageDealtToChampionShareOfTeam')}
      ${d3('魔法伤害·团队','mag','averageMagicDamageDealtToChampionShareOfTeam')}
      ${d3('真实伤害·团队','tru','averageTrueDamageDealtToChampionShareOfTeam')}
    </div></div>`;
  // 插到段位卡后面
  const rc=document.getElementById('cRanks');rc.insertAdjacentHTML('afterend',html);
}

/* ---------- 分路 + 英雄池 ---------- */
function renderTwoCol(){
  const st=(state.ma&&state.ma.statistics)||{};
  const pos=st.positions||{},champs=st.champions||{},primary=st.primaryPosition;
  const posArr=Object.values(pos).sort((a,b)=>b.count-a.count);
  const champArr=Object.values(champs).sort((a,b)=>b.count-a.count||b.win-a.win);
  const posHtml=posArr.length?posArr.map(p=>{
    const wr=p.count?p.win/p.count:0;
    return `<div class="pos-item"><span class="nm">${posCn(p.position)||p.position}${p.position===primary?' ★':''}</span>
      ${meter('team',p.count,posArr[0].count)}<span class="muted">${p.count}场 ${p.win}胜${p.lose}负 · ${pct(wr,0)}</span></div>`;
  }).join(''):'<div class="muted">暂无</div>';
  const champHtml=champArr.length?champArr.map(c=>{
    const wr=c.count?c.win/c.count:0;
    return `<div class="champ-item">${img(champIcon(c.id),'mini-champ')}
      <div class="info"><div class="top"><span class="nm">${esc(champCn(c.id))}</span><span class="muted">${c.count}场 ${c.win}胜${c.lose}负 · ${pct(wr,0)}</span></div>
      <div class="winbar"><i style="width:${wr*100}%"></i></div></div></div>`;
  }).join(''):'<div class="muted">暂无</div>';
  $('root').insertAdjacentHTML('beforeend',`
  <div class="card" id="cTwoCol"><h2>分路分布 / 英雄池</h2>
    <div class="two-col">
      <div><div class="muted" style="margin-bottom:8px">主打位置：<b>${posCn(primary)||'—'}</b></div><div class="pos-list">${posHtml}</div></div>
      <div class="champ-list">${champHtml}</div>
    </div></div>`);
}

/* ---------- 常排队友 ---------- */
function renderMates(){
  const rel=(state.ma&&state.ma.relationship)||[];
  const self=state.ctx.puuid;
  const list=rel.filter(r=>String(r.targetPuuid)!==String(self))
    .sort((a,b)=>(b.teammateGames||0)-(a.teammateGames||0)||(b.totalGames||0)-(a.totalGames||0)).slice(0,8);
  const html=list.length?list.map(r=>`<div class="mate">
      ${img(avatarUrl(r.targetProfileIconId),'')}
      <span class="mn">${esc(r.targetGameName)}<span class="muted">#${esc(r.targetTagLine)}</span></span>
      <span class="mc">同队 <b style="color:var(--green)">${r.teammateGames||0}</b> 场（${r.teammateWins||0}胜）</span>
      <span class="mc">对手 ${r.opponentGames||0} 场</span>
      <span class="mc">近期同局 ${r.recentGames||0}</span></div>`).join('')
    :'<div class="muted">近期没有检测到固定队友</div>';
  $('root').insertAdjacentHTML('beforeend',`<div class="card" id="cMates"><h2>常排队友（近窗口）</h2><div class="mate-list">${html}</div></div>`);
}

/* ---------- 战绩列表 ---------- */
function renderMatchesHolder(loading){
  let el=document.getElementById('cMatches');if(el)el.remove();
  $('root').insertAdjacentHTML('beforeend',`<div class="card" id="cMatches"><h2>对局记录</h2>
    <div class="tabs" id="mTabs"></div><div id="mList">${loading?'<div class="loading">加载中…</div>':''}</div>
    <div class="pager" id="mPagers"></div></div>`);
  const tabs=$('mTabs');
  tabs.innerHTML=QUEUE_TABS.map(t=>`<button data-v="${t.v}" class="${state.queue===t.v?'on':''}">${t.n}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(state.loading)return;loadPage(1,Number(b.dataset.v));});
}
function csOf(p){return (Number(p.totalMinionsKilled)||0)+(Number(p.neutralMinionsKilled)||0);}
function matchHead(m,self){
  const p=(m.participants||[]).find(x=>String(x.puuid)===String(self))||m.participants[0]||{};
  const win=String(p.win).toLowerCase()==='true'||p.win===true;
  const remake=(m.gameDuration||0)>0&&m.gameDuration<=180;
  const k=p.kills||0,d=p.deaths||0,a=p.assists||0;
  const cid=p.championID??p.championId;
  const items=[];for(let i=0;i<7;i++){const id=p['item'+i];const u=itemIcon(id);items.push(u?`<img src="${u}" loading="lazy">`:'<span class="slot"></span>');}
  const spells=[spellIcon(p.spell1Id),spellIcon(p.spell2Id)].filter(Boolean).map(u=>`<img src="${u}" loading="lazy">`).join('');
  const ksRune=p.perks&&p.perks.styles&&p.perks.styles[0]?runeIcon(p.perks.styles[0].selections[0].perk):'';
  const secRune=p.perks&&p.perks.styles&&p.perks.styles[1]?runeIcon(p.perks.styles[1].style):'';
  const flags=[];
  if(remake)flags.push('重开');
  if(p.gameEndedInSurrender||p.gameEndedInEarlySurrender)flags.push('投降');
  if(p.firstBloodKill)flags.push('一血');
  if(p.pentaKills>0)flags.push('五杀');else if(p.quadraKills>0)flags.push('四杀');else if(p.tripleKills>0)flags.push('三杀');
  const resCls=remake?'remake':(win?'win':'lose'),resTxt=remake?'重开':(win?'胜':'负');
  const mh=(()=>{const ratio=d>0?((k+a)/d):null;let t;
    if(ratio===null)t=(k+a)>0?'A':'D';else if(ratio>=5)t='A';else if(ratio>=3)t='B';else if(ratio>=2)t='C';else t='D';
    const ch={A:'上',B:'中',C:'下',D:'牛'}[t],lb={A:'上等马',B:'中等马',C:'下等马',D:'牛马'}[t];
    return remake?'':`<span class="m-horse h-${t}" title="${lb}">${ch}</span>`;})();
  return `<div class="m-row" data-open="0">
    <div class="m-res ${resCls}">${resTxt}</div>
    <div class="m-champ">${img(champIcon(cid,p.championName))}
      <div style="min-width:0"><div class="cn">${esc(champCn(cid,p.championName))}</div>
      <div class="sub">${posCn(p.individualPosition||p.teamPosition)||'—'} · ${p.champLevel||0}级${flags.length?' · '+flags.join('·'):''}</div></div></div>
    <div class="m-kda"><span class="kk">${k}</span><span class="sep">/</span><span class="dd">${d}</span><span class="sep">/</span><span class="aa">${a}</span>
      <div class="ratio">${kdaOf(k,d,a).toFixed(2)} KDA ${mh}</div></div>
    <div class="m-icons">${spells}${ksRune?`<img src="${ksRune}" loading="lazy">`:''}${secRune?`<img src="${secRune}" loading="lazy">`:''}</div>
    <div class="m-items">${items.join('')}</div>
    <div class="m-info">${esc(queueName(m.queueId,m.gameMode))}<br>${fmtDateTime(m.gameStartTimestamp||m.gameCreation)} · ${fmtDur(m.gameDuration)}<br>补刀 ${csOf(p)} · 金钱 ${fmtK(p.goldEarned)} · 伤害 ${fmtK(p.totalDamageDealtToChampions)}</div>
  </div>`;
}
const OBJ_LABELS=[['champion','击杀'],['baron','大龙'],['dragon','小龙'],['riftHerald','先锋'],['tower','防御塔'],['inhibitor','水晶'],['atakhan','Atakhan'],['horde','部落']];
function teamBlock(m,t,self){
  const players=(m.participants||[]).filter(p=>Number(p.teamId)===Number(t.teamId));
  const objs=t.objectives||{};
  const objChips=OBJ_LABELS.filter(([k])=>objs[k]&&objs[k].kills>0).map(([k,n])=>`<span class="obj">${n} ${objs[k].kills}</span>`).join('');
  const bans=(t.bans||[]).map(b=>{const u=champIcon(b.championId);return b.championId>0&&u?`<img src="${u}" loading="lazy">`:'<span class="slot"></span>';}).join('');
  const win=String(t.win).toLowerCase()==='true'||t.win===true;
  const headCols=`<div class="pl pl-head"><span></span><span></span><span>玩家</span>
      <span class="num">K/D/A</span><span class="num">等级</span><span class="num">补刀</span><span class="num">金钱</span><span class="num">伤害</span><span class="num">承伤</span><span>技能/符文</span><span></span></div>`;
  const rows=players.map(p=>{
    const cid=p.championID??p.championId;
    const hl=String(p.puuid)===String(self);
    const spells=[spellIcon(p.spell1Id),spellIcon(p.spell2Id)].filter(Boolean).map(u=>`<img src="${u}" loading="lazy">`);
    let runes=[];
    if(p.perks&&p.perks.styles){const st=p.perks.styles;
      if(st[0]&&st[0].selections&&st[0].selections[0])runes.push(runeIcon(st[0].selections[0].perk));
      if(st[1])runes.push(runeIcon(st[1].style));}
    const items=[];for(let i=0;i<7;i++){const u=itemIcon(p['item'+i]);items.push(u?`<img src="${u}" loading="lazy">`:'<span class="slot"></span>');}
    return `<div class="pl ${hl?'hl':''}">
      <span>${Number(p.teamId)===100?'蓝':'红'}</span>
      ${img(champIcon(cid,p.championName),'c')}
      <span class="pname">${esc(p.riotIdGameName||'—')}<span class="t">#${esc(p.riotIdTagline||'')}</span>${hl?' ★':''}</span>
      <span class="num"><span class="pk">${p.kills||0}</span>/<span class="pd">${p.deaths||0}</span>/<span>${p.assists||0}</span></span>
      <span class="num">${p.champLevel||0}</span>
      <span class="num">${csOf(p)}</span>
      <span class="num">${fmtK(p.goldEarned)}</span>
      <span class="num">${fmtK(p.totalDamageDealtToChampions)}</span>
      <span class="num">${fmtK(p.totalDamageTaken)}</span>
      <span class="picons">${spells.join('')}${runes.filter(Boolean).map(u=>`<img src="${u}" loading="lazy">`).join('')}</span>
      <span class="pitems">${items.join('')}</span></div>`;
  }).join('');
  return `<div class="team t${t.teamId}">
    <div class="team-head">
      <span class="side">${Number(t.teamId)===100?'蓝色方':'红色方'}</span>
      <span class="res ${win?'win':'lose'}">${win?'胜利':'失败'}</span>
      ${objChips}
      <span class="bans"><span class="lab">BAN</span>${bans}</span>
    </div>
    <div class="pl-scroll">${headCols}${rows}</div>
  </div>`;
}
function matchDetail(m,self){
  const teams=(m.teams||[]).slice().sort((a,b)=>Number(a.teamId)-Number(b.teamId));
  return `<div class="m-detail">${teams.map(t=>teamBlock(m,t,self)).join('')}</div>`;
}
function renderMatches(){
  const list=(state.ma&&state.ma.matchHistory)||[];
  const box=$('mList');
  if(!list.length){box.innerHTML='<div class="empty">该模式下没有查到对局</div>';renderPager(0);return;}
  box.innerHTML=list.map(m=>`<div class="match" data-gid="${m.gameId}">${matchHead(m,state.ctx.puuid)}${matchDetail(m,state.ctx.puuid)}</div>`).join('');
  box.querySelectorAll('.m-row').forEach(row=>row.onclick=()=>{
    const wrap=row.closest('.match');const open=wrap.classList.toggle('open');
    row.dataset.open=open?'1':'0';
  });
  renderPager(list.length);
}
function renderPager(n){
  const pg=$('mPagers');
  const hasMore=n>=state.size;
  pg.innerHTML=`<button class="sec" ${state.page<=1||state.loading?'disabled':''} id="pgPrev">上一页</button>
    <span class="pg">第 ${state.page} 页${hasMore?'':'（已到最早）'}</span>
    <button class="sec" ${!hasMore||state.loading?'disabled':''} id="pgNext">下一页</button>`;
  const pre=$('pgPrev'),nx=$('pgNext');
  if(pre)pre.onclick=()=>loadPage(state.page-1,state.queue);
  if(nx)nx.onclick=()=>loadPage(state.page+1,state.queue);
}

/* ---------- 初始化 ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  $('launchBtn').addEventListener('click',onLaunchClick);
  $('stopSvc').addEventListener('click',shutdownSvc);
  if(window.LolPool)LolPool.bind('poolBtn');
  $('macShCopy').addEventListener('click',async()=>{
    const t=$('macShCmd').textContent.trim();
    try{await navigator.clipboard.writeText(t);toast('安装命令已复制','s');}
    catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('安装命令已复制','s');}catch(_){toast('复制失败，请手动复制','w');}ta.remove();}
  });
  const asc=$('autoStopChk');
  try{const v=localStorage.getItem('lolzjcx_auto_stop');if(v!==null)asc.checked=v==='1';}catch(e){}
  asc.addEventListener('change',()=>{try{localStorage.setItem('lolzjcx_auto_stop',asc.checked?'1':'0');}catch(e){}});
  // URL 参数 ?name=&tag=（从多人页跳转）优先，其次恢复上次输入
  const usp=new URLSearchParams(location.search);
  const uName=(usp.get('name')||usp.get('n')||'').trim();
  const uTag=(usp.get('tag')||usp.get('t')||'').trim().replace(/^#/,'');
  if(uName&&/^\d{2,}$/.test(uTag)){
    $('qInput').value=`${uName}#${uTag}`;
    autoQuery={name:uName,tag:uTag};
  }else{
    try{const v=localStorage.getItem(QKEY);if(v)$('qInput').value=v;}catch(e){}
  }
  $('qBtn').onclick=()=>doSearch();
  $('qInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
});
</script>
