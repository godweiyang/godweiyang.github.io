<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PUBG 作战数据舱</title>
<style>
:root{
  --bg0:#04060c;
  --cyan:#22d3ee; --blue:#38bdf8; --gold:#fbbf24; --green:#34d399;
  --orange:#fb923c; --red:#fb7185; --violet:#a78bfa;
  --txt:#dbe7ff; --sub:#8298bd; --weak:#5b6d8f;
  --panel:linear-gradient(160deg,rgba(22,33,58,.68),rgba(9,15,29,.52));
  --brd:rgba(96,168,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg0);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh;background:
  radial-gradient(1100px 620px at 12% -8%,rgba(34,211,238,.14),transparent 60%),
  radial-gradient(1000px 640px at 92% -4%,rgba(99,102,241,.16),transparent 60%),
  radial-gradient(900px 700px at 50% 118%,rgba(56,189,248,.10),transparent 62%),
  linear-gradient(180deg,#05080f,#04060c 60%)}
#bgFx{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1580px;margin:0 auto;padding:22px 26px 40px}
header.hud{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:18px 22px;border-radius:18px;background:var(--panel);border:1px solid var(--brd);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 22px 60px rgba(0,0,0,.5);
  position:relative;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
header.hud::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.7;animation:sweep 4.2s linear infinite}
@keyframes sweep{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.hud-l{flex:1;min-width:260px}
.crumb{font-size:11.5px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.85}
.pname{font-size:34px;font-weight:800;letter-spacing:.5px;line-height:1.15;margin:6px 0 8px;
  background:linear-gradient(92deg,#fff,#bfe4ff 55%,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 26px rgba(56,189,248,.25)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid rgba(120,170,255,.22);background:rgba(56,189,248,.08);color:#bcd6f5;letter-spacing:.4px}
.chip b{color:#fff;font-weight:700}
.horse{position:relative;width:118px;height:118px;flex:0 0 auto;display:grid;place-items:center}
.horse .ring{position:absolute;inset:0;border-radius:50%}
.horse .core{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.16),rgba(12,20,38,.92));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 18px rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.4)}
.horse .hl{font-size:19px;font-weight:800;letter-spacing:1px;line-height:1.1}
.horse .hs{font-size:10px;color:var(--sub);margin-top:3px}
.horse .hscore{font-size:13px;font-weight:700;color:#fff}
.horse.T .ring{background:conic-gradient(from 0deg,#fbbf24,#fff6d5,#f59e0b,#fde68a,#fbbf24);animation:spin 3.6s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));filter:drop-shadow(0 0 10px rgba(251,191,36,.6))}
.horse.A .ring{background:conic-gradient(from 0deg,#34d399,#a7f3d0,#10b981,#34d399);opacity:.9;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.B .ring{background:conic-gradient(from 0deg,#38bdf8,#bae6fd,#0ea5e9,#38bdf8);opacity:.85;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.C .ring{background:conic-gradient(from 0deg,#fb923c,#fed7aa,#f97316,#fb923c);opacity:.8;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.D .ring{background:conic-gradient(from 0deg,#fb7185,#fecdd3,#e11d48,#fb7185);opacity:.8;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.horse.N .ring{background:rgba(120,140,170,.35);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
@keyframes spin{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin:14px 0}
.kpi{position:relative;padding:14px 14px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--brd);overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--c,var(--cyan)),transparent)}
.kpi .v{font-size:25px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600;margin-left:1px}
.kpi .l{font-size:11.5px;color:var(--sub);margin-top:7px;letter-spacing:.6px}
.kpi .spark{position:absolute;right:6px;bottom:6px;opacity:.6}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.grid>*{min-width:0}
.cv{min-width:0;overflow:hidden}
.panel{position:relative;border-radius:15px;background:var(--panel);border:1px solid var(--brd);padding:14px 16px 15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 18px 48px rgba(0,0,0,.42);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.panel .corner{position:absolute;width:12px;height:12px;border:0 solid var(--cyan);opacity:.55;pointer-events:none;z-index:3}
.panel .corner.tl{top:7px;left:7px;border-top-width:1.5px;border-left-width:1.5px;border-top-left-radius:4px}
.panel .corner.tr{top:7px;right:7px;border-top-width:1.5px;border-right-width:1.5px;border-top-right-radius:4px}
.panel .corner.bl{bottom:7px;left:7px;border-bottom-width:1.5px;border-left-width:1.5px;border-bottom-left-radius:4px}
.panel .corner.br{bottom:7px;right:7px;border-bottom-width:1.5px;border-right-width:1.5px;border-bottom-right-radius:4px}
.panel h3{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:#cfe3ff;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:4px;height:13px;border-radius:2px;background:linear-gradient(var(--cyan),var(--violet));box-shadow:0 0 8px var(--cyan)}
.panel h3 .tag{margin-left:auto;font-size:10.5px;color:var(--weak);letter-spacing:.5px;font-weight:500;text-align:right}
.panel .sub{font-size:10.5px;color:var(--weak);margin:2px 0 8px 12px;letter-spacing:.3px}
.cv{position:relative;width:100%}
.cv canvas{display:block;width:100%}
.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
/* 风格原型 */
#archBox{margin-top:6px}
.arch-name{text-align:center;font-size:17px;font-weight:800;letter-spacing:1px;margin:2px 0 3px;
  background:linear-gradient(92deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.arch-desc{text-align:center;font-size:10.5px;color:var(--sub);margin-bottom:10px}
.trait{display:grid;grid-template-columns:64px 1fr 34px;gap:8px;align-items:center;font-size:11px;margin:6px 0}
.trait .tn{color:#cdddf7}.trait .tbar{height:6px;border-radius:4px;background:rgba(120,150,200,.13);overflow:hidden}
.trait .tbar i{display:block;height:100%;border-radius:4px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.trait .tv{text-align:right;color:#fff;font-variant-numeric:tabular-nums;font-weight:700}
/* 地图战术卡 */
.tac{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tcard{border-radius:11px;padding:10px 12px;border:1px solid rgba(120,170,255,.14);background:rgba(10,18,34,.5);position:relative;overflow:hidden}
.tcard .tn{font-size:13.5px;font-weight:800;color:#eaf4ff;display:flex;justify-content:space-between}
.tcard .tn span{color:var(--cyan);font-size:11px}
.tcard .tr{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:10.5px;color:var(--sub)}
.tcard .tr b{color:#fff;font-weight:700}
.tcard .wr{height:5px;border-radius:4px;background:rgba(120,150,200,.13);margin-top:8px;overflow:hidden}
.tcard .wr i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b)}
/* 段位 / 纪录 紧凑 */
.dual{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.rk{border-radius:11px;padding:9px 11px;border:1px solid rgba(120,170,255,.15);background:rgba(10,18,34,.5);position:relative;overflow:hidden}
.rk .rb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:11px;color:#06101f;float:left;margin-right:9px}
.rk .rt{font-size:13.5px;font-weight:800;line-height:1.15}.rk .rs{font-size:10.5px;color:var(--sub);margin-top:2px}
.rk .rh{clear:both;font-size:10.5px;margin-top:7px;padding-top:6px;border-top:1px dashed rgba(120,160,220,.18);color:var(--sub)}.rk .rh b{font-weight:800}
.rk.none .rt{color:var(--sub);font-weight:600;font-size:12.5px}
.hist-hero{display:flex;align-items:center;gap:12px;border-radius:12px;padding:9px 13px;margin-bottom:9px;background:linear-gradient(120deg,rgba(251,191,36,.14),rgba(251,191,36,.03));border:1px solid rgba(251,191,36,.3)}
.hist-hero .hb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#1a1405;background:linear-gradient(140deg,#fde68a,#f59e0b);box-shadow:0 0 18px rgba(251,191,36,.5);flex:0 0 auto}
.hist-hero .ht1{font-size:10.5px;color:#fcd34d;letter-spacing:1px}.hist-hero .ht2{font-size:16.5px;font-weight:800;color:#ffe9b0}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.rc{border-radius:10px;padding:8px 11px;background:rgba(10,18,34,.5);border:1px solid rgba(120,170,255,.13);position:relative;overflow:hidden}
.rc .rv{font-size:18px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.rc .rv small{font-size:11px;color:var(--sub);font-weight:600}
.rc .rl{font-size:10.5px;color:var(--sub);margin-top:5px;letter-spacing:.3px}
#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(8,14,28,.95);border:1px solid rgba(56,189,248,.4);border-radius:10px;padding:9px 11px;font-size:11.5px;box-shadow:0 12px 34px rgba(0,0,0,.6),0 0 18px rgba(56,189,248,.15);max-width:250px;line-height:1.6;backdrop-filter:blur(6px)}
#tip b{color:#fff}#tip .g{color:var(--gold)}#tip .c{color:var(--cyan)}
.empty{margin:14vh auto;max-width:440px;text-align:center;border:1px dashed rgba(120,160,220,.3);border-radius:16px;padding:40px 26px;background:rgba(12,20,38,.4)}
.empty h2{font-size:20px;margin-bottom:10px;color:#e6f1ff}.empty p{color:var(--sub);font-size:13px;line-height:1.8}
.empty a{display:inline-block;margin-top:16px;padding:9px 20px;border-radius:10px;background:linear-gradient(120deg,var(--cyan),var(--blue));color:#04121f;font-weight:700;text-decoration:none}
footer{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--weak);font-size:11px;letter-spacing:.5px;padding:0 4px}
footer a{color:var(--cyan);text-decoration:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.wrap{padding:14px 12px 30px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.col-3,.col-4,.col-5,.col-7,.col-8,.col-12{grid-column:span 2}.dual{grid-template-columns:1fr}.pname{font-size:26px}.horse{width:96px;height:96px}.horse .core{width:72px;height:72px}}
</style>
</head>
<body>
<canvas id="bgFx"></canvas>
<div class="wrap" id="app"></div>
<div id="tip"></div>
<script>
"use strict";
const KEY='pubg_arena_payload';
function readPayload(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}
const P=readPayload();
const TIER_CN={Bronze:'青铜',Silver:'白银',Gold:'黄金',Platinum:'铂金',Crystal:'翡翠',Diamond:'钻石',Master:'大师',Survivor:'幸存者',Grandmaster:'宗师'};
const TIER_COLOR={Bronze:'#c08a52',Silver:'#9fb0c3',Gold:'#e3b53b',Platinum:'#34c49c',Crystal:'#22c3d6',Diamond:'#4f86e8',Master:'#a78bfa',Survivor:'#f0557d',Grandmaster:'#ff6b6b'};
const ROMAN={1:'Ⅰ',2:'Ⅱ',3:'Ⅲ',4:'Ⅳ',5:'Ⅴ'};
const WTYP={AR:['突击步枪','#38bdf8'],SMG:['冲锋枪','#2dd4bf'],DMR:['射手步枪','#a78bfa'],SR:['栓动狙击','#fb7185'],LMG:['轻机枪','#fbbf24'],SG:['霰弹枪','#34d399'],PST:['手枪','#94a3b8'],oth:['其他','#8b98ad']};
const WSHORT={AR:'突击',SMG:'冲锋',DMR:'射手',SR:'栓狙',LMG:'轻机',SG:'霰弹',PST:'手枪',oth:'其他'};
const HCOL={T:'#fbbf24',A:'#34d399',B:'#38bdf8',C:'#fb923c',D:'#fb7185',N:'#64748b'};
const HNAME={T:'天选马',A:'上等马',B:'中等马',C:'下等马',D:'没有马',N:'暂无评级'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp1=(v,lo,hi)=>hi>lo?clamp((v-lo)/(hi-lo),0,1):0;
const easeOut=t=>1-Math.pow(1-t,3);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))));};
function linReg(ys){const n=ys.length;if(n<2)return 0;const mx=(n-1)/2,my=mean(ys);let num=0,den=0;ys.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)*(i-mx);});return den?num/den:0;}
function smooth(arr,w){return arr.map((_,i)=>mean(arr.slice(Math.max(0,i-w+1),i+1)));}
const fmtNum=v=>Number(v||0).toLocaleString('en-US');
const fmtKm=m=>(m/1000).toFixed(m>=10000?0:1)+'km';
const fmtMin=s=>{s=Math.round(s||0);return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒';};
const fmtMM=s=>{s=Math.round(s||0);return (s/60).toFixed(1);};
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const dateOf=ts=>{const d=new Date(ts);return isNaN(d)?null:d;};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

if(!P){document.getElementById('app').innerHTML='<div class="empty"><h2>暂无作战数据</h2><p>请先在 PUBG 战绩查询的「单人查询」里搜索玩家，再点击顶部的 <b>⚡数据大屏</b> 按钮进入本页。</p><a href="/pubg/#/single">返回查询页</a></div>';}
else{
const L=P.life,R=L.rounds||1,M=P.matches||[],MG=[...M].reverse(); // MG 时间正序
const winRate=L.wins/R,topRate=L.top10/R,hsRate=L.kills?L.hs/L.kills:0;
const kpg=L.kills/R,dpg=L.dmg/R,dbpg=L.dbno/R,apg=L.assists/R,avgSurv=L.time/R,rpg=L.revives/R;
const DPR=Math.min(window.devicePixelRatio||1,2);

/* ===== 复合分析：风格六维 + 原型 ===== */
const ranksArr=M.map(g=>g.rank),rankStd=std(ranksArr);
const HORDER=['T','A','B','C','D','N'];
const trans={},hcnt={T:0,A:0,B:0,C:0,D:0,N:0};
MG.forEach(g=>{hcnt[g.horse]=(hcnt[g.horse]||0)+1;});
let selfLoop=0,transTot=0;
for(let i=1;i<MG.length;i++){const a=MG[i-1].horse,b=MG[i].horse;if(!a||!b)continue;trans[a]=trans[a]||{};trans[a][b]=(trans[a][b]||0)+1;transTot++;if(a===b)selfLoop++;}
const selfLoopRate=transTot?selfLoop/transTot:0;
const rankScore=MG.map(g=>(101-clamp(g.rank,1,100))/100);
const trendSlope=linReg(smooth(rankScore,Math.max(3,Math.round(MG.length/8)||3)));
const trendNorm=lerp1(trendSlope,-0.02,0.02);
const TRAITS=[
 {k:'agg',n:'突击火力',v:clamp(0.30*lerp1(L.kd,0.3,2.5)+0.25*lerp1(kpg,0.2,1.5)+0.20*lerp1(hsRate,0.05,0.45)+0.15*lerp1(L.longestKill/100,1,6)+0.10*lerp1(L.roundMost,3,15),0,1)},
 {k:'surv',n:'生存韧性',v:clamp(0.35*lerp1(avgSurv/60,8,26)+0.30*lerp1(topRate,0.3,0.85)+0.20*lerp1((L.heals+L.boosts)/R,1,12)+0.15*lerp1(winRate,0.02,0.25),0,1)},
 {k:'sup',n:'团队支援',v:clamp(0.40*lerp1(rpg,0.05,0.8)+0.35*lerp1(apg,0.1,1.2)+0.25*lerp1(dbpg/(kpg+dbpg+1e-9),0.3,0.7),0,1)},
 {k:'mob',n:'机动游走',v:clamp(0.50*lerp1(L.move/R/1000,1,6)+0.30*lerp1(L.roadKills/R,0.005,0.1)+0.20*lerp1(L.swim/(L.move+1),0.005,0.05),0,1)},
 {k:'burst',n:'爆发连杀',v:clamp(0.35*lerp1(L.maxStreak,2,12)+0.30*lerp1(L.roundMost,3,15)+0.35*lerp1(Math.max(...M.map(g=>g.kills),0),2,12),0,1)},
 {k:'cons',n:'稳定掌控',v:clamp(0.40*(1-lerp1(rankStd,8,30))+0.30*selfLoopRate+0.30*trendNorm,0,1)}
];
const ARCH={agg:['突击先锋','枪口永远对准交火最密的方向，正面碾压型选手'],surv:['苟分大师','决赛圈永远有你的位置，稳健运营到最后'],sup:['战地医疗兵','击倒救援一肩挑，团队的隐形大腿'],mob:['机动游走','载具与双腿从不闲着，转场如风的战场自由人'],burst:['爆种杀手','不鸣则已一鸣惊人，连杀机器一旦启动挡不住'],cons:['稳定老狗','状态几乎不跳水，队伍最可靠的基本盘']};
(function(){const sorted=[...TRAITS].sort((a,b)=>b.v-a.v);const top=sorted[0],sec=sorted[1];
  let arch=ARCH[top.k];
  if(sorted[0].v>0.62&&sorted[1].v>0.58&&sorted.filter(t=>t.v>0.5).length>=4)arch=['六边形战士','没有明显短板的全能型选手，攻守兼备'];
  window.__ARCH=arch;window.__TRAITS=TRAITS;})();

/* ===== 地图战术聚合 ===== */
const mapTac={};M.forEach(g=>{const k=g.map||'未知';if(!mapTac[k])mapTac[k]={n:0,w:0,k:0,d:0,mode:{}};const t=mapTac[k];t.n++;if(g.won)t.w++;t.k+=g.kills;t.d+=g.dmg;t.mode[g.mode]=(t.mode[g.mode]||0)+1;});

 const pts=MG.map((g,i)=>({g,i,
  x:clamp(g.time/maxT,0,1)*2-1,
  y:clamp(g.dmg/maxD,0,1)*2-1,

 let ang=0.6,tilt=0.42,drag=null,hover=-1;
 function size(){W=cv.clientWidth;H=fixedH;cv.width=W*DPR;cv.height=H*DPR;cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
 function project(p,a){const ca=Math.cos(a),sa=Math.sin(a),ct=Math.cos(tilt),st=Math.sin(tilt);
  let x=p.x*ca-p.z*sa,z1=p.x*sa+p.z*ca;let y=p.y*ct-z1*st,z2=p.y*st+z1*ct;
  const f=3.2,s=f/(f-z2*0.9);return{x:W/2+x*Math.min(W,H)*0.34*s,y:H/2-y*Math.min(W,H)*0.34*s,s,z:z2};}
 function draw(){size();ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2,R=Math.min(W,H)*0.34;

  // 三个主轴：从中心出发，箭头方向随旋转投影
  const axesDef=[{e:{x:1,y:0,z:0},n:'存活',c:'#34d399'},{e:{x:0,y:1,z:0},n:'伤害',c:'#fb7185'},{e:{x:0,y:0,z:1},n:'名次',c:'#fbbf24'}];
  const O3=project({x:0,y:0,z:0},ang);

   ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
   let dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;const px=-dy,py=dx,al=9,aw=4.4;

  axesDef.forEach(a=>{const neg=project({x:-a.e.x,y:-a.e.y,z:-a.e.z},ang),pos=project(a.e,ang);
   ctx.strokeStyle=a.c+'2e';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(neg.x,neg.y);ctx.lineTo(O3.x,O3.y);ctx.stroke();

   ctx.font='bold 10.5px sans-serif';ctx.textAlign=Math.abs(dx/L)<0.4?'center':(dx>0?'left':'right');ctx.textBaseline='middle';ctx.fillStyle=a.c;ctx.shadowColor=a.c;ctx.shadowBlur=6;ctx.fillText(a.n,lx,ly);ctx.shadowBlur=0;});
  const pr=pts.map((p,i)=>Object.assign(project(p,ang),{p,i}));

  ctx.lineWidth=1.2;for(let i=1;i<pr.length;i++){const a=pr[i-1],b=pr[i];const al=0.10+0.18*(i/pr.length);ctx.strokeStyle=`rgba(56,189,248,${al})`;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}

   const alpha=Math.round(clamp(0.30+hsr*0.95,0.30,0.98)*255).toString(16).padStart(2,'0');
   const hx=gx+1,hw=Math.max(2,gw-4),hh=Math.max(1.5,bh-1.5);
   ctx.fillStyle=col+alpha;ctx.fillRect(hx,y,hw,hh);
   if(gw>42&&bh>22){ctx.fillStyle='#eef6ff';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(x.name.length>7?x.name.slice(0,6)+'…':x.name,hx+3,y+3);ctx.fillStyle='#d7e6fb';ctx.font='9px sans-serif';ctx.fillText(x.kills+'杀',hx+3,y+15);}
   x._rx=hx;x._ry=y;x._rw=hw;x._rh=hh;y+=bh;});
  g._x=gx;g._w=gw;gx+=gw;});
 ctx.canvas._groups=gArr;});
(function(){const o=drawers.find(d=>d.cv.id==='cvTree');if(!o)return;
 o.cv.addEventListener('mousemove',e=>{const r=o.cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let hit=null,gt=null;
  (o.cv._groups||[]).forEach(g=>{(g._cells||[]).forEach(c=>{if(mx>=c.x._rx&&mx<=c.x._rx+c.x._rw&&my>=c.x._ry&&my<=c.x._ry+c.x._rh){hit=c.x;gt=g;}});});
  if(hit){const tn=WTYP[hit.type]||WTYP.oth;tip.innerHTML=`<b style="color:${tn[1]}">${hit.name}</b> · ${tn[0]}<br>${hit.kills}杀 · 爆头 ${hit.hs}（${hit.kills?(hit.hs/hit.kills*100).toFixed(0):0}%）<br>击倒 ${hit.grog} · 伤害 ${fmtNum(hit.dmg)}<br>最远 ${hit.longest}m · 单场最高 ${hit.best}`;tip.style.opacity=1;moveTip(e);}else hideTip();});
 o.cv.addEventListener('mouseleave',hideTip);})();

/* 9) 星期 × 小时 热力 */
setupCanvas('cvHeat',(ctx,w,h,p)=>{const pad={l:34,r:8,t:14,b:26};const grid=Array.from({length:7},()=>Array(24).fill(0)),wing=Array.from({length:7},()=>Array(24).fill(0));
 MG.forEach(g=>{const d=dateOf(g.ts);if(!d)return;const dw=(d.getDay()+6)%7,hh=d.getHours();grid[dw][hh]++;if(g.won)wing[dw][hh]++;});
 let mx=1;grid.forEach(r=>r.forEach(v=>mx=Math.max(mx,v)));const cw=(w-pad.l-pad.r)/24,chh=(h-pad.t-pad.b)/7,pp=easeOut(p);
 const dayN=['周一','周二','周三','周四','周五','周六','周日'];
 for(let dw=0;dw<7;dw++)for(let hh=0;hh<24;hh++){const v=grid[dw][hh];const inten=clamp(v/mx,0,1)*pp;
   ctx.fillStyle=v?`rgba(56,189,248,${0.12+inten*0.78})`:'rgba(120,150,200,.07)';
   ctx.fillRect(pad.l+hh*cw+1,pad.t+dw*chh+1,cw-2,chh-2);
   if(wing[dw][hh]>0){ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(pad.l+hh*cw+cw/2,pad.t+dw*chh+chh/2,Math.min(cw,chh)/2-3,0,7);ctx.stroke();}}
 ctx.fillStyle='#8298bd';ctx.font='9px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
 for(let dw=0;dw<7;dw++)ctx.fillText(dayN[dw],pad.l-4,pad.t+dw*chh+chh/2);
 ctx.textAlign='center';ctx.textBaseline='top';for(let hh=0;hh<24;hh+=3)ctx.fillText(hh+'时',pad.l+hh*cw+cw/2,h-pad.b+5);
 ctx.textAlign='left';ctx.fillStyle='#5b6d8f';ctx.fillText('金圈=该时段吃过鸡',pad.l,pad.t-10);});

/* ===== 背景粒子 ===== */
const bg=document.getElementById('bgFx'),bctx=bg.getContext('2d');let pts=[];
function bgSize(){bg.width=innerWidth*DPR;bg.height=innerHeight*DPR;bg.style.width=innerWidth+'px';bg.style.height=innerHeight+'px';bctx.setTransform(DPR,0,0,DPR,0,0);
 const n=Math.min(70,Math.floor(innerWidth*innerHeight/26000));pts=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22}));}
function bgDraw(){const W=innerWidth,H=innerHeight;bctx.clearRect(0,0,W,H);
 pts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<0||pt.x>W)pt.vx*=-1;if(pt.y<0||pt.y>H)pt.vy*=-1;});
 for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dd=dx*dx+dy*dy;if(dd<130*130){bctx.strokeStyle='rgba(56,189,248,'+(0.08*(1-Math.sqrt(dd)/130))+')';bctx.beginPath();bctx.moveTo(a.x,a.y);bctx.lineTo(b.x,b.y);bctx.stroke();}}
 pts.forEach(pt=>{bctx.fillStyle='rgba(120,200,255,.5)';bctx.beginPath();bctx.arc(pt.x,pt.y,1.3,0,7);bctx.fill();});requestAnimationFrame(bgDraw);}

/* ===== 静态面板动画 ===== */
const T0=performance.now(),DUR=1300;
function frame(t){const p=clamp((t-T0)/DUR,0,1);drawers.forEach(o=>o.render(p));if(p<1)requestAnimationFrame(frame);}
window.addEventListener('resize',()=>{bgSize();drawers.forEach(o=>o.render(1));});
bgSize();bgDraw();requestAnimationFrame(frame);
}
</script>
