<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOL 战绩多人对比</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1f2329;--sub:#6b7280;--line:#e3e7ee;--blue:#2563eb;--pri:#5b2a86;--red:#dc2626;--org:#d97706;--green:#16a34a;--win:#16a34a;--lose:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-user-select:text;user-select:text}
html,body,div,span,p,b,td,th,label,h1,h2,h3,li,code{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{-webkit-user-select:none;user-select:none}
img{display:block}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
/* 顶部服务栏（与 lolzjcx2 同一套） */
header.top{background:linear-gradient(135deg,#3a1d5e,#5b2a86);color:#fff;border-radius:14px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:9px}
header.top h1{font-size:19px;margin:0;letter-spacing:2px;text-align:center}
.svcbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
.svc{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;gap:6px}
.svc i{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block}
.svc.on{background:rgba(255,255,255,.2)}.svc.on i{background:#4ade80;box-shadow:0 0 6px #4ade80}
.svc-tip{font-size:12px;color:rgba(255,255,255,.85)}
.svc-dl{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c3aed,#9a6dd7);padding:4px 13px;border-radius:999px;text-decoration:none;white-space:nowrap}
.svc-dl:hover{filter:brightness(1.08)}
.svc-opt{font-size:12px;color:rgba(255,255,255,.9);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.svc-b{background:transparent!important;border:1px solid rgba(255,255,255,.55)!important;color:rgba(255,255,255,.92)!important;font-weight:400}
.svc-b.primary{background:var(--pri)!important;border-color:var(--pri)!important;color:#fff!important;font-weight:700}
.svc-b.warn{background:#f59e0b!important;border-color:#f59e0b!important;color:#fff!important;font-weight:700}
.svc-path{flex-basis:100%;text-align:center;font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.svc-macsh{flex-basis:100%;display:none;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:11px;color:rgba(255,255,255,.8)}
.svc-macsh code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.13);border-radius:6px;padding:2px 8px;font-size:11px;color:#fff;word-break:break-all;text-align:left;line-height:1.5}
.svc-macsh button{font-size:11px;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:2px 10px;cursor:pointer}
a.svc-dis{opacity:.5;pointer-events:none}
.svc-stop{font-size:12px;font-weight:700;color:#fff;background:rgba(220,38,38,.85);padding:4px 13px;border-radius:999px;white-space:nowrap;border:0}
.svc-stop:hover{background:rgba(220,38,38,1)}
.navlink{font-size:12px;color:rgba(255,255,255,.85);text-decoration:underline;white-space:nowrap}
/* 卡片/通用 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:12px}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;background:var(--blue);color:#fff}
button.sec{background:#efeaf7;color:var(--pri)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.7;font-size:16px}
.toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast div{padding:9px 14px;border-radius:8px;color:#fff;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.t-e{background:var(--red)}.t-s{background:var(--green)}.t-w{background:var(--org)}
.hint{font-size:11.5px;color:var(--sub);margin-top:6px}
.search-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-row select{min-width:130px}
.search-row button{min-width:96px}
/* 结果元信息条 */
.resbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:4px 2px 0}
.resbar b{color:var(--ink)}
.resbar .spacer{flex:1}
/* 多列布局：每人一列 */
.cols{display:grid;gap:12px;margin-top:12px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.col.pending{min-height:220px}
/* 列头 */
.col-head{padding:13px 13px 10px;border-bottom:1px solid var(--line);position:relative}
.ch-top{display:flex;gap:10px;align-items:flex-start}
.ch-avatar{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:#f3f4f6;flex:0 0 auto}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:16px;font-weight:800;line-height:1.25;word-break:break-word;color:var(--ink);text-decoration:none;display:inline}
.ch-name:hover{color:var(--pri)}
.ch-name .tag{color:var(--sub);font-weight:600;font-size:13px}
.ch-go{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:7px;background:#f1ecfb;color:var(--pri);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px}
.ch-go:hover{background:#e4daf7}
.ch-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--sub);align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:#eef2ff;color:#3730a3}
.pill.priv{background:#fdecec;color:var(--red)}
.ch-horse{text-align:center;font-size:15px;font-weight:800;letter-spacing:1px;margin-top:9px;min-height:20px}
.h-A{color:#16a34a}.h-B{color:#2563eb}.h-C{color:#ea8a16}.h-D{color:#dc2626}.h-N{color:var(--sub);font-weight:600;font-size:12px}
/* 迷你段位 */
.rankmini{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line)}
.rm{display:flex;align-items:center;gap:7px;background:#faf9fd;border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-width:0}
.rm img{width:30px;height:30px;flex:0 0 auto}
.rm .rm-t{font-size:12px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .rm-q{font-size:10.5px;color:var(--sub)}
.rm .rm-lp{font-size:10.5px;color:var(--org);font-weight:700}
.rm.none{justify-content:center;color:var(--sub);font-size:11.5px}
/* 汇总四宫格 */
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 13px;border-bottom:1px solid var(--line)}
.sm{text-align:center;background:#f8f6fc;border-radius:8px;padding:6px 2px}
.sm .v{font-size:15px;font-weight:800;color:var(--pri);line-height:1.2}
.sm .l{font-size:10.5px;color:var(--sub);margin-top:1px}
/* 常用英雄图标 */
.champrow{display:flex;gap:6px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:center}
.champrow img{width:32px;height:32px;border-radius:8px;background:#f3f4f6}
.champrow .lab{font-size:11px;color:var(--sub);margin-right:2px;white-space:nowrap}
/* 对局列表（列内独立滚动） */
.mlist{max-height:560px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:9px;display:flex;flex-direction:column;gap:7px}
.mm{border-radius:9px;padding:7px 9px;border:1px solid #eee;background:#fff}
.mm.win{background:#ecfdf3;border-color:#c9ebd3}
.mm.lose{background:#fdecec;border-color:#f3c9c9}
.mm.remake{background:#f3f4f6;border-color:#e5e7eb}
.mm .r1{display:flex;align-items:center;gap:7px}
.mm .res{flex:0 0 26px;height:26px;border-radius:7px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.mm.win .res{background:var(--win)}.mm.lose .res{background:var(--lose)}.mm.remake .res{background:#9ca3af}
.mm .cn{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.mm .kda{font-weight:800;font-size:13px;white-space:nowrap;flex:0 0 auto}
.mm .kda .kk{color:var(--green)}.mm .kda .dd{color:var(--red)}.mm .kda .aa{color:#111827}.mm .kda .sep{color:var(--sub);font-weight:400}
.mm .ic{margin-left:auto;display:flex;gap:2px;align-items:center;flex:0 0 auto}
.mm .ic img{width:19px;height:19px;border-radius:4px}
.mm .r2{font-size:10.8px;color:var(--sub);margin-top:3px;line-height:1.5;display:flex;justify-content:space-between;gap:6px}
.mm .r2 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm .r2 .tm{white-space:nowrap;flex:0 0 auto}
/* 列内状态 */
.col-status{padding:26px 14px;text-align:center;color:var(--sub);font-size:12.5px}
.col-status.err{color:var(--red)}
.spinner{width:26px;height:26px;border:3px solid #e3e7ee;border-top-color:var(--pri);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.col-err-body{padding:14px;font-size:12px;color:var(--red);word-break:break-word}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:13px}
@media (max-width:900px){
  .cols{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:6px}
  .col{flex:0 0 84vw;max-width:84vw;scroll-snap-align:start}
}
@media (max-width:640px){
  .wrap{max-width:100%;padding:10px 8px 46px}
  header.top{padding:12px 11px;border-radius:12px}
  header.top h1{font-size:17px;letter-spacing:1px}
  .card{padding:12px 11px;margin:11px 0;border-radius:11px}
  input,select,textarea{font-size:16px}
  .mlist{max-height:60vh}
  .toast{left:12px;right:12px;bottom:12px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>LOL 战绩查询</h1>
    <div class="svcbar">
      <span class="svc" id="svcPill"><i></i><span id="svcText">检测中…</span></span>
      <a class="svc-dl" id="launchBtn" href="lolzjcx://start" style="display:none" title="浏览器若询问是否打开，选允许">启动服务</a>
      <button class="svc-stop" id="stopSvc" style="display:none">停止服务</button>
      <a class="svc-dl svc-b" id="dlBtn" href="/medias/files/lolzjcx_service.exe" download>下载本地服务</a>
      <label id="autoStopWrap" class="svc-opt" style="display:none"><input type="checkbox" id="autoStopChk" checked>关闭页面后自动停</label>
      <a class="navlink" href="/lolzjcx2/">单人详情版</a>
      <a class="navlink" href="/lolzjcx/">简版多人页</a>
      <span class="svc-tip" id="svcTip" style="display:none"></span>
      <span class="svc-path" id="svcPath" style="display:none"></span>
      <span class="svc-macsh" id="macShWrap">
        <span>免安全提示安装：打开「终端」粘贴执行一行命令</span>
        <code id="macShCmd">curl -fsSL https://godweiyang.com/medias/files/install_mac.sh | bash</code>
        <button type="button" id="macShCopy">复制命令</button>
      </span>
    </div>
  </header>

  <!-- 查询 -->
  <div class="card">
    <h2>多人对比查询（每人一列 · 近 15 场）</h2>
    <textarea id="qInput" placeholder="每行一个 名字#尾标，可直接粘贴队伍聊天，例如：&#10;godweiyang#23456&#10;老公你努努力呀 #83805 加入了队伍聊天&#10;（最多 5 人）"></textarea>
    <div class="search-row" style="margin-top:9px">
      <label class="muted">队列</label>
      <select id="qQueue"></select>
      <div class="spacer" style="flex:1"></div>
      <button id="qBtn">开始查询</button>
    </div>
    <div class="hint">逐人串行查询（每完整 1 人消耗 3 次额度，号不够会自动补号）；点卡片右上角图标可在新标签页打开该玩家的单人完整详情。</div>
  </div>

  <div id="resBar"></div>
  <div id="cols" class="cols"></div>
  <div id="emptyTip"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================ 本机服务（与 lolzjcx2 同一套） */
const API='http://127.0.0.1:17530';
const $=id=>document.getElementById(id);
async function rawFetch(path,opt,timeout=20000){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),timeout);
  try{return await fetch(API+path,Object.assign({signal:ctrl.signal},opt));}
  finally{clearTimeout(to);}
}
async function api(name,body,timeout=30000){
  let resp;
  try{resp=await rawFetch('/api/'+name,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})},timeout);}
  catch(e){setConnected(false);throw new Error('本地服务未连接，请先启动本地服务');}
  if(!resp.ok)throw new Error('本地服务返回 '+resp.status);
  const r=await resp.json();setConnected(true);
  if(!r.ok)throw new Error(r.error||'操作失败');
  return r.data;
}
let online=null,inited=false,svcVer='',svcPath='',forceDl=false,launchWatch=null;
const LATEST_VERSION='1.5.0';
const UA=(navigator.userAgent||'')+' '+(navigator.platform||'');
const IS_MAC=/macintosh|mac os x|iphone|ipad|ipod/i.test(UA);
const IS_ANDROID=/android/i.test(UA);
const DL_URL=IS_MAC?'/medias/files/lolzjcx_service_mac.zip':(IS_ANDROID?'/medias/files/lolzjcx_service_android.apk':'/medias/files/lolzjcx_service.exe');
const PTAG=IS_MAC?'Mac':(IS_ANDROID?'安卓':'Windows');
const L_DL=`下载本地服务（${PTAG}）`,L_FIRST=`下载本地服务（${PTAG}·首次使用）`,L_REDL=`重新下载本地服务（${PTAG}）`;
const L_UP_NOVER='更新本地服务（版本过旧）',L_UP=(o,n)=>`更新本地服务 v${o}→v${n}`;
const TIP_FIRST=IS_MAC?'推荐用下方终端命令一键安装（免 Gatekeeper 安全提示）；也可下载解压后右键→打开 App 一次'
  :IS_ANDROID?'下载 APK 安装（需允许“安装未知来源应用”），打开 App 点一次「启动服务」；以后直接点网页「启动服务」'
  :'下载后双击运行一次，以后直接点「启动服务」';
const TIP_RETRY=IS_MAC?'没启动起来？重跑下方终端命令，或下载解压后双击 App 运行一次'
  :IS_ANDROID?'没启动起来？打开已安装的 App 点「启动服务」即可':'没启动起来？下载后双击运行一次即可';
const TIP_UPDATE=IS_MAC?'推荐重跑下方终端命令自动更新（免安全提示）；或下载解压后右键→打开 App'
  :IS_ANDROID?'下载新版 APK 覆盖安装即可，账号数据保留':'下载后双击即可，新版会自动停掉旧服务并接管';
function protoUrl(){const h=location.hostname;return(h==='localhost'||h==='127.0.0.1'||h==='[::1]')?'lolzjcxdev://start':'lolzjcx://start';}
function isInstalled(){try{return localStorage.getItem('lolzjcx_installed')==='1';}catch(e){return false;}}
function agoText(ts){if(!ts)return'';const s=(Date.now()-ts)/1000;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return Math.floor(s/86400)+' 天前';}
function onLaunchClick(){
  if(online!==false||!isInstalled()||forceDl)return;
  clearTimeout(launchWatch);
  launchWatch=setTimeout(()=>{if(online)return;forceDl=true;renderSvc();
    toast(`没有检测到服务启动；若本地服务${IS_ANDROID?'未安装或被卸载':'已被删除或移动'}，请点右上角「${L_REDL}」`,'w');},4500);
}
function cmpVer(a,b){const pa=String(a||'0').split('.').map(x=>parseInt(x)||0),pb=String(b||'0').split('.').map(x=>parseInt(x)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=pa[i]||0,y=pb[i]||0;if(x!==y)return x<y?-1:1;}return 0;}
function setSvcVersion(v,path){svcVer=v||'';if(path)svcPath=path;
  if(online&&path){try{localStorage.setItem('lolzjcx_last_svc',JSON.stringify({path,ts:Date.now()}));}catch(e){}}renderSvc();}
function renderSvc(){
  const pill=$('svcPill'),txt=$('svcText'),launch=$('launchBtn'),stop=$('stopSvc'),
        dl=$('dlBtn'),aw=$('autoStopWrap'),tip=$('svcTip'),pathEl=$('svcPath'),macSh=$('macShWrap');
  const macCmd=show=>{macSh.style.display=(IS_MAC&&show)?'flex':'none';};
  dl.href=DL_URL;dl.classList.remove('primary','warn');
  const setTip=t=>{if(t){tip.textContent=t;tip.style.display='';}else tip.style.display='none';};
  const setPath=t=>{if(t){pathEl.textContent=t;pathEl.style.display='';}else pathEl.style.display='none';};
  if(online===null){pill.classList.remove('on');txt.textContent='检测中…';stop.style.display='none';launch.style.display='none';
    dl.textContent=L_DL;setTip('');setPath('');aw.style.display='none';macCmd(true);return;}
  launch.classList.remove('svc-dis');
  if(online){clearTimeout(launchWatch);forceDl=false;pill.classList.add('on');txt.textContent='服务已运行';
    launch.style.display='none';stop.style.display='';aw.style.display='';
    const noVer=!svcVer,outdated=noVer||cmpVer(svcVer,LATEST_VERSION)<0;macCmd(outdated);
    pill.title=svcVer?('本地服务 v'+svcVer+(outdated?'（最新 v'+LATEST_VERSION+'）':'')):'';
    if(outdated){dl.classList.add('warn');dl.textContent=noVer?L_UP_NOVER:L_UP(svcVer,LATEST_VERSION);setTip(TIP_UPDATE);}
    else{dl.textContent=L_DL;setTip('');}
    setPath(svcPath?('当前服务：'+svcPath):'');return;}
  pill.classList.remove('on');txt.textContent='服务未运行';
  stop.style.display='none';aw.style.display='none';launch.style.display='';launch.href=protoUrl();
  if(!isInstalled()){launch.textContent='启动服务';launch.classList.add('svc-dis');
    dl.classList.add('primary');dl.textContent=L_FIRST;setTip(TIP_FIRST);setPath('');macCmd(true);return;}
  macCmd(true);launch.classList.remove('svc-dis');launch.textContent='启动服务';
  if(forceDl){dl.classList.add('warn');dl.textContent=L_REDL;setTip(TIP_RETRY);}else{dl.textContent=L_DL;setTip('');}
  let last=null;try{last=JSON.parse(localStorage.getItem('lolzjcx_last_svc')||'null');}catch(e){}
  setPath(last&&last.path?('上次运行：'+last.path+' · '+agoText(last.ts)):'');
}
function setConnected(on){
  if(on===online)return;online=on;
  if(on){try{localStorage.setItem('lolzjcx_installed','1');}catch(e){}if(!inited)inited=true;}
  renderSvc();
}
async function shutdownSvc(){
  if(!confirm('确定关闭本地服务吗？关闭后将暂停查询，需要时点页面上的「启动服务」即可，无需再找本地程序。'))return;
  try{await api('shutdown',{},6000);}catch(e){}setConnected(false);toast('本地服务已关闭','w');
}
function autoStopOn(){const c=$('autoStopChk');return !c||c.checked;}
let failCount=0,probing=false;
async function probe(force){
  if(probing&&!force)return;probing=true;
  const t0=online===null?1200:3000,grace=online===null?3:4;
  try{const resp=await rawFetch('/api/health?hb=1&as='+(autoStopOn()?'1':'0'),{method:'GET'},t0);
    if(resp.ok){const j=await resp.json();if(j&&j.ok){failCount=0;const d=j.data||{};setConnected(true);setSvcVersion(d.version,d.path);}else failCount++;}
    else failCount++;
  }catch(e){failCount++;}
  probing=false;if(failCount>=grace)setConnected(false);
}
setInterval(()=>probe(false),2000);probe(true);

function toast(msg,type='s'){const t=$('toast');const d=document.createElement('div');d.className='t-'+type;d.textContent=msg;t.appendChild(d);setTimeout(()=>d.remove(),3600);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============================================================ 静态字典（复用 lolzjcx2 的 data） */
const DICT_BASE=location.pathname.replace(/[^/]*$/,'')+'../lolzjcx2/data/';

/* ============================================================ 映射表 */
const TIER_CN={IRON:'黑铁',BRONZE:'青铜',SILVER:'白银',GOLD:'黄金',PLATINUM:'铂金',EMERALD:'翡翠',DIAMOND:'钻石',MASTER:'大师',GRANDMASTER:'傲世宗师',CHALLENGER:'最强王者'};
const TIER_COLOR={IRON:'#6b7280',BRONZE:'#a1693c',SILVER:'#7d8a99',GOLD:'#d4a017',PLATINUM:'#2fa88a',EMERALD:'#1f9e6b',DIAMOND:'#3b76d6',MASTER:'#8b5cf6',GRANDMASTER:'#d14141',CHALLENGER:'#e0a028'};
const QUEUE_TABS=[{v:-1,n:'所有队列'},{v:420,n:'单双排'},{v:430,n:'匹配模式'},{v:440,n:'灵活组排'},{v:450,n:'极地大乱斗'},{v:480,n:'快速模式'},{v:2400,n:'海克斯大乱斗'}];
const QUEUE_NAME={0:'全部模式',400:'征召模式',420:'单双排',430:'匹配模式',440:'灵活组排',450:'极地大乱斗',480:'快速模式',325:'灵活组排(旧)',700:'克隆模式',
  830:'入门人机',840:'新手人机',850:'一般人机',870:'入门人机',880:'新手人机',890:'人机模式',900:'无限乱斗',1020:'无限火力',1300:'终极魔典',
  1700:'斗魂竞技场',1750:'斗魂竞技场',1900:'无限火力',2400:'海克斯大乱斗',2450:'经典海斗',4310:'经典匹配'};
const MODE_CN={CLASSIC:'召唤师峡谷',ARAM:'极地大乱斗',ARENA:'斗魂竞技场',CHERRY:'斗魂竞技场',KIWI:'海克斯大乱斗',KIWI_JADE:'经典海斗',URF:'无限火力',ULTBOOK:'终极魔典',ONERORALL:'克隆模式'};
const REGION_CN={HN1:'艾欧尼亚',HN2:'祖安',HN3:'诺克萨斯',HN4:'班德尔城',HN5:'皮尔特沃夫',HN6:'战争学院',HN7:'巨神峰',HN8:'雷瑟守备',HN9:'裁决之地',HN10:'黑色玫瑰',
  HN11:'暗影岛',HN12:'钢铁烈阳',HN13:'水晶之痕',HN14:'均衡教派',HN15:'影流',HN16:'守望之海',HN17:'征服之海',HN18:'卡拉曼达',HN19:'皮城警备',BGP2:'峡谷之巅',PBE:'试炼之地'};
const POS_CN={TOP:'上路',JUNGLE:'打野',MIDDLE:'中路',MID:'中路',BOTTOM:'下路',UTILITY:'辅助',SUPPORT:'辅助',ADC:'下路',CARRY:'下路',APEX:'竞技场'};
function regionName(c){if(!c)return'—';const k=String(c).toUpperCase().replace('TENCENT_','');return REGION_CN[k]||k;}
function tierCn(t){return TIER_CN[String(t||'').toUpperCase()]||String(t||'');}
function tierColor(t){return TIER_COLOR[String(t||'').toUpperCase()]||'#6b7280';}
function queueName(qid,mode){return QUEUE_NAME[qid]||MODE_CN[String(mode||'').toUpperCase()]||(qid?('模式'+qid):'未知');}
function posCn(p){return POS_CN[String(p||'').toUpperCase()]||'';}
function pct(x,d){if(x==null||isNaN(x))return'—';return (x*100).toFixed(d==null?0:d)+'%';}
function fmtK(n){n=Number(n)||0;return n>=10000?(n/1000).toFixed(1)+'万':(n>=1000?(n/1000).toFixed(1)+'k':String(n));}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function fmtDateTime(ms){if(!ms)return'—';const d=new Date(Number(ms)),p=n=>String(n).padStart(2,'0');return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function kdaOf(k,d,a){return d>0?((k+a)/d):(k+a);}
function tierRank(t,r){if(!t||['NONE','UNRANKED'].includes(String(t).toUpperCase()))return'';
  const no=['MASTER','GRANDMASTER','CHALLENGER'];const tn=tierCn(t);return tn+(no.includes(String(t).toUpperCase())||!r?'':(' '+r));}
function csOf(p){return (Number(p.totalMinionsKilled)||0)+(Number(p.neutralMinionsKilled)||0);}

/* ============================================================ 输入解析（与后端 parse_summoners 同口径） */
function stripInvis(s){return String(s||'').replace(/[​-‏‪-‮⁠-⁤⁦-⁩﻿]/g,'');}
function parseSummoners(text){
  const parts=String(text||'').split(/[\r\n;；]+/).map(stripInvis);
  const out=[],seen=new Set(),noise=/(加入了队伍聊天|加入队伍|队伍聊天|joined\s+the\s+team|joined\s+queue).*$/i;
  for(let raw of parts){
    let seg=raw.trim();if(!seg)continue;
    let m=seg.match(/#\s*(\d{2,})/);
    if(!m)m=seg.match(/\s(\d{3,})\s*$/);
    if(!m)continue;
    let name=seg.slice(0,m.index).replace(noise,'');
    name=name.replace(/^\s*\d+\s*[.\)、\-:：]\s*/,'').replace(/[\s,，、:：·\-]+$/,'').trim();
    if(!name)continue;
    const key=name.toLowerCase()+'|'+m[1];
    if(seen.has(key))continue;seen.add(key);
    out.push({name,tag:m[1]});
  }
  return out;
}

/* ============================================================ 状态与查询 */
const QKEY='lolzjcx3_query',QUEUE_KEY='lolzjcx3_queue',RES_KEY='lolzjcx3_results';
const S2='/lolzjcx2/';
const state={running:false,poll:null,targets:[],results:[],queue:-1,ts:null};
function singleUrl(name,tag){return S2+'?name='+encodeURIComponent(name)+'&tag='+encodeURIComponent(tag);}
function resultMap(){const m={};state.results.forEach(r=>{if(r&&r.ok)m[r.name.toLowerCase()+'|'+r.tag]=r;});return m;}
function setQueueOptions(){
  const sel=$('qQueue');sel.innerHTML=QUEUE_TABS.map(t=>`<option value="${t.v}">${t.n}</option>`).join('');
  let q=-1;try{q=parseInt(localStorage.getItem(QUEUE_KEY)||'-1');}catch(e){}
  sel.value=String(QUEUE_TABS.some(t=>t.v===q)?q:-1);
  sel.onchange=()=>{try{localStorage.setItem(QUEUE_KEY,sel.value);}catch(e){}};
}
function setBtn(){const b=$('qBtn');if(state.running){b.textContent='停止';b.style.background='var(--red)';}else{b.textContent='开始查询';b.style.background='';}}
async function toggleQuery(){
  if(state.running){try{await api('stop_job',{});}catch(e){}return;}
  if(online!==true){await probe(true);if(online!==true){toast('本地服务未运行，请先点右上角「启动服务」或下载本地服务','e');return;}}
  const text=$('qInput').value;
  const list=parseSummoners(text);
  if(!list.length){toast('没有识别到“名字#尾标”，请每行一个或直接粘贴队伍聊天','e');return;}
  if(list.length>5){toast(`一次最多 5 人，当前识别到 ${list.length} 人`,'e');return;}
  try{localStorage.setItem(QKEY,text);}catch(e){}
  state.queue=parseInt($('qQueue').value||'-1');
  state.targets=list;state.results=[];state.ts=Date.now();state.running=true;setBtn();
  renderColumns();renderResBar();
  try{
    await api('start_detail_batch',{params:{summoners:text,queue:state.queue,size:15}},20000);
  }catch(e){state.running=false;setBtn();toast(e.message,'e');return;}
  pollLoop();
}
async function pollLoop(){
  if(state.poll)return;
  const tick=async()=>{
    if(!state.running)return;
    let job=null;
    try{const resp=await rawFetch('/api/job_status',{method:'GET'},10000);
      if(resp.ok){const j=await resp.json();if(j&&j.ok){setConnected(true);job=j.data;}}
    }catch(e){/* 忽略单次轮询失败 */}
    if(job&&job.type==='detail_batch'){
      state.results=Array.isArray(job.results)?job.results:[];
      renderColumns();renderResBar();
      if(job.finished){state.running=false;setBtn();state.poll=null;persist();renderColumns();renderResBar();
        if(job.fail>0)toast(`完成：成功 ${job.ok}，失败 ${job.fail}`,'w');else toast('全部查询完成','s');return;}
    }
    state.poll=setTimeout(tick,1000);
  };
  tick();
}
function persist(){try{localStorage.setItem(RES_KEY,JSON.stringify({ts:state.ts,queue:state.queue,targets:state.targets,results:state.results}));}catch(e){}}

/* ---------- 马评级（与 lolview.summarize 同口径，按本人近15场，剔除重开） ---------- */
function selfPart(m,puuid){return (m.participants||[]).find(x=>String(x.puuid)===String(puuid))||(m.participants||[])[0]||{};}
function horseOf(ma,puuid){
  const games=(ma.matchHistory||[]).filter(m=>(m.gameDuration||0)>180).map(m=>selfPart(m,puuid));
  const pool=games.length?games:(ma.matchHistory||[]).map(m=>selfPart(m,puuid));
  if(!pool.length)return{tier:'N',label:'暂无评级'};
  let tk=0,td=0,ta=0;pool.forEach(p=>{tk+=p.kills||0;td+=p.deaths||0;ta+=p.assists||0;});
  const ratio=td>0?((tk+ta)/td):null;let tier;
  if(ratio===null)tier=(tk+ta)>0?'A':'N';else if(ratio>=5)tier='A';else if(ratio>=3)tier='B';else if(ratio>=2)tier='C';else tier='D';
  const label={A:'上等马',B:'中等马',C:'下等马',D:'牛马',N:'暂无评级'}[tier];
  return{tier,label};
}

/* ---------- 渲染 ---------- */
function renderResBar(){
  const bar=$('resBar');
  if(!state.targets.length){bar.innerHTML='';return;}
  const regions=[...new Set(state.results.filter(r=>r.ok).map(r=>regionName(r.serverId)))];
  const qn=(QUEUE_TABS.find(t=>t.v===state.queue)||{}).n||'所有队列';
  const done=state.results.length,total=state.targets.length;
  const prog=state.running?` · 查询中 ${done}/${total}`:(done?` · 共 ${done} 人`:'');
  bar.innerHTML=`<div class="card" style="padding:11px 16px;margin:12px 0 0">
    <div class="resbar">
      <span>聚合查询：<b>${esc(qn)}</b></span>
      <span>查询时间：<b>${state.ts?fmtDateTime(state.ts):'—'}</b></span>
      <span>大区：<b>${regions.length?regions.join('、'):'—'}</b></span>
      <span class="spacer"></span>
      <button class="sec" id="reBtn" style="padding:6px 14px">重新搜索</button>
    </div>
    <div class="hint" style="margin:4px 0 0">${state.running?'逐人串行查询，请勿重复点击'+prog:'查询完成'+prog}</div>
  </div>`;
  $('reBtn').onclick=()=>{state.targets=[];state.results=[];state.ts=null;bar.innerHTML='';$('cols').innerHTML='';$('emptyTip').innerHTML='';
    try{localStorage.removeItem(RES_KEY);}catch(e){}
    $('qInput').focus();window.scrollTo({top:0,behavior:'smooth'});};
}
function miniRank(q,label){
  const placed=q&&q.tier&&!['NONE','UNRANKED'].includes(String(q.tier).toUpperCase());
  if(!placed)return `<div class="rm none"><span>${label} —</span></div>`;
  return `<div class="rm">
    <img src="${rankIcon(q.tier)}" alt="">
    <div style="min-width:0"><div class="rm-t" style="color:${tierColor(q.tier)}">${esc(tierRank(q.tier,q.rank))}</div>
    <div class="rm-q">${label}<span class="rm-lp"> · ${q.leaguePoints??0}胜点</span></div></div></div>`;
}
function matchMini(m,puuid){
  const p=selfPart(m,puuid);
  const win=p.win===true||String(p.win).toLowerCase()==='true';
  const remake=(m.gameDuration||0)>0&&m.gameDuration<=180;
  const cid=p.championID??p.championId;
  const k=p.kills||0,d=p.deaths||0,a=p.assists||0;
  const cls=remake?'remake':(win?'win':'lose'),tag=remake?'重':(win?'胜':'负');
  const spells=[spellIcon(p.spell1Id),spellIcon(p.spell2Id)].filter(Boolean);
  const ks=(p.perks&&p.perks.styles&&p.perks.styles[0]&&p.perks.styles[0].selections[0])?runeIcon(p.perks.styles[0].selections[0].perk):'';
  const icons=[...spells,ks].filter(Boolean).map(u=>`<img src="${u}" loading="lazy">`).join('');
  const flags=[];if(p.gameEndedInSurrender||p.gameEndedInEarlySurrender)flags.push('投降');if(p.firstBloodKill)flags.push('一血');
  return `<div class="mm ${cls}">
    <div class="r1">
      <span class="res">${tag}</span>
      <span class="cn">${esc(champCn(cid,p.championName))}</span>
      <span class="kda"><span class="kk">${k}</span><span class="sep">/</span><span class="dd">${d}</span><span class="sep">/</span><span class="aa">${a}</span></span>
      <span class="ic">${icons}</span>
    </div>
    <div class="r2">
      <span class="t">${esc(queueName(m.queueId,m.gameMode))} · ${posCn(p.individualPosition||p.teamPosition)||'—'} · ${p.champLevel||0}级${flags.length?' · '+flags.join('·'):''}</span>
      <span class="tm">${fmtDateTime(m.gameStartTimestamp||m.gameCreation)}</span>
    </div>
    <div class="r2"><span class="t">补刀 ${csOf(p)} · 金钱 ${fmtK(p.goldEarned)} · 伤害 ${fmtK(p.totalDamageDealtToChampions)} · ${fmtDur(m.gameDuration)}</span></div>
  </div>`;
}
function columnOk(r){
  const ov=r.overview||{},b=ov.base||{},rk=(ov.ranked&&ov.ranked.queues)||{};
  const ma=r.match_analysis||{},st=ma.statistics||{},s=st.summary||{};
  const priv=String(b.privacy||'').toUpperCase();
  const horse=horseOf(ma,r.puuid);
  const champs=Object.values(st.champions||{}).sort((x,y)=>y.count-x.count||y.win-x.win).slice(0,5);
  const games=(ma.matchHistory||[]);
  const link=singleUrl(r.name,r.tag);
  return `<div class="col" data-k="${esc(r.name.toLowerCase()+'|'+r.tag)}">
    <div class="col-head">
      <a class="ch-go" href="${link}" target="_blank" rel="noopener" title="打开单人完整详情（新标签页）">⤢</a>
      <div class="ch-top">
        ${img(avatarUrl(b.profileIconId),'ch-avatar')}
        <div class="ch-info">
          <a class="ch-name" href="${link}" target="_blank" rel="noopener">${esc(b.gameName||r.name)}<span class="tag">#${esc(b.tagLine||r.tag)}</span></a>
          <div class="ch-meta">
            <span class="pill">${esc(regionName(r.serverId))}</span>
            <span>等级 ${b.level??'—'}</span>
            ${priv&&priv!=='PUBLIC'?'<span class="pill priv">隐私私密</span>':''}
          </div>
        </div>
      </div>
      <div class="ch-horse h-${horse.tier}">${esc(horse.label)}</div>
    </div>
    <div class="rankmini">${miniRank(rk.RANKED_SOLO_5x5,'单双')}${miniRank(rk.RANKED_FLEX_SR,'灵活')}</div>
    <div class="sumrow">
      <div class="sm"><div class="v">${s.averageKda!=null?Number(s.averageKda).toFixed(2):'—'}</div><div class="l">KDA</div></div>
      <div class="sm"><div class="v">${pct(s.winRate)}</div><div class="l">胜率</div></div>
      <div class="sm"><div class="v">${pct(s.averageKillParticipationRate,1)}</div><div class="l">参团</div></div>
      <div class="sm"><div class="v">${pct(s.averageGoldShareOfTeam,1)}</div><div class="l">经济</div></div>
    </div>
    <div class="champrow"><span class="lab">常用</span>${champs.length?champs.map(c=>img(champIcon(c.id),'')).join(''):'<span class="muted">—</span>'}</div>
    <div class="mlist">${games.length?games.map(m=>matchMini(m,r.puuid)).join(''):'<div class="empty">没有查到对局</div>'}</div>
  </div>`;
}
function columnPending(t,status){
  if(status==='loading')return `<div class="col pending"><div class="col-status"><div class="spinner"></div>查询中<br>${esc(t.name)}#${esc(t.tag)}</div></div>`;
  return `<div class="col pending"><div class="col-status">等待查询<br>${esc(t.name)}#${esc(t.tag)}</div></div>`;
}
function columnErr(r){
  return `<div class="col"><div class="col-head">
      <div class="ch-top"><div class="ch-info"><div class="ch-name" style="color:var(--sub)">${esc(r.name)}<span class="tag">#${esc(r.tag)}</span></div></div></div>
      <div class="ch-horse h-N">查询失败</div></div>
    <div class="col-err-body">${esc(r.error||'未知错误')}</div></div>`;
}
function renderColumns(){
  const wrap=$('cols');const map=resultMap();const errMap={};
  state.results.forEach(r=>{if(r&&!r.ok)errMap[r.name.toLowerCase()+'|'+r.tag]=r;});
  wrap.style.gridTemplateColumns=`repeat(${Math.max(1,state.targets.length)},minmax(0,1fr))`;
  let html='';
  state.targets.forEach((t,i)=>{
    const key=t.name.toLowerCase()+'|'+t.tag;
    if(map[key])html+=columnOk(map[key]);
    else if(errMap[key])html+=columnErr(errMap[key]);
    else html+=columnPending(t,(state.running&&i===state.results.length)?'loading':'wait');
  });
  wrap.innerHTML=html;
  $('emptyTip').innerHTML='';
}

document.addEventListener('DOMContentLoaded',()=>{

  try{const saved=JSON.parse(localStorage.getItem(RES_KEY)||'null');

      state.targets=saved.targets||[];state.results=saved.results;state.queue=saved.queue??-1;state.ts=saved.ts||null;
      $('qQueue').value=String(state.queue);renderColumns();renderResBar();}
  }catch(e){}
});
