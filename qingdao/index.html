function buildMap(container,dayIdxs,opts){
 const map=new AMap.Map(container,{viewMode:'2D',zoom:12});
 (window.__MAPS=window.__MAPS||[]).push(map);
 const overlays=[];
 dayIdxs.forEach(di=>{
   const d=DAYS[di];
   let stops=d.stops,base=0;
   if(opts&&opts.fromIndex){stops=d.stops.slice(opts.fromIndex);base=opts.fromIndex;}

   for(let i=0;i<pts.length-1;i++){
     const s=stops[i];
     let path=[pts[i],pts[i+1]];
     if(s.manual)path=s.manual.map(c=>new AMap.LngLat(c[0],c[1]));
     overlays.push(new AMap.Polyline({path:path,strokeColor:d.c,strokeWeight:4,
       strokeOpacity:s.mode==='metro'?.72:.92,zIndex:20,
       strokeStyle:s.mode==='metro'?'dashed':'solid',lineJoin:'round'}));
   }
   stops.forEach(s=>{
     if(s.n===null||s.n===undefined)return;
     overlays.push(new AMap.Marker({position:s.pos,offset:new AMap.Pixel(-12,-12),zIndex:60,
       content:'<div class="num" style="background:'+d.c+'">'+s.n+'</div>',clickable:false}));
   });
 });
 if(!(opts&&opts.noHotel)){
   overlays.push(new AMap.Marker({position:HOTEL,offset:new AMap.Pixel(-40,-14),zIndex:90,
     content:'<div class="hotel">住 · 中山路地铁站</div>'}));
 }
 map.on('complete',()=>{
   overlays.forEach(o=>o.setMap(map));
   map.setFitView(overlays,false,[40,40,40,40]);
 });
}

function slog(){}
function markDone(k){window[k]=true;if(window.__CITY_DONE&&window.__HD_DONE)window.__ROUTES_DONE=true;}

let routeQueue=Promise.resolve();
function enqueue(fn){const r=routeQueue.then(fn);routeQueue=r.catch(()=>{});return r;}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function walkInner(walker,a,b){
 return new Promise(res=>{
   let attempts=0;
   function attempt(){
     attempts++;
     let done=false;
     const to=setTimeout(()=>{
       if(done)return;done=true;
       if(attempts<3)delay([400,900][attempts-1]).then(attempt);else res(null);
     },8000);
     try{
      walker.search(new AMap.LngLat(a[0],a[1]),new AMap.LngLat(b[0],b[1]),(s,r)=>{
       if(done)return;done=true;clearTimeout(to);
       let arr=null;
       try{const p=[];r.routes[0].steps.forEach(sp=>(sp.path||[]).forEach(q=>p.push([q.lng,q.lat])));if(p.length>1)arr=p;}catch(e){}
       if(arr)res(arr);else if(attempts<3)delay([400,900][attempts-1]).then(attempt);else res(null);
      });
     }catch(e){if(done)return;done=true;clearTimeout(to);if(attempts<3)delay([400,900][attempts-1]).then(attempt);else res(null);}
   }
   attempt();
 });
}
function walkRoute(walker,a,b){return enqueue(()=>walkInner(walker,a,b));}
function metroInner(transfer,a,b){
 return new Promise(res=>{
   let attempts=0;
   function attempt(){
     attempts++;
     let done=false;
     const to=setTimeout(()=>{
       if(done)return;done=true;
       if(attempts<3)delay([400,900][attempts-1]).then(attempt);else res(null);
     },8000);
     try{
      transfer.search(new AMap.LngLat(a[0],a[1]),new AMap.LngLat(b[0],b[1]),(s,r)=>{
       if(done)return;done=true;clearTimeout(to);
       const paths=[];
       try{
        r.plans[0].segments.forEach(sg=>{
         const t=sg.transit;
         if(t&&t.path&&t.path.length>1)paths.push(t.path.map(q=>[q.lng,q.lat]));
        });
       }catch(e){}
       if(paths.length)res(paths);else if(attempts<3)delay([400,900][attempts-1]).then(attempt);else res(null);
      });
     }catch(e){if(done)return;done=true;clearTimeout(to);if(attempts<3)delay([400,900][attempts-1]).then(attempt);else res(null);}
   }
   attempt();
 });
}
function metroRoute(transfer,a,b){return enqueue(()=>metroInner(transfer,a,b));}

function nudge(path,meters){
 if(!meters)return path;
 const res=path.map(c=>[c[0],c[1]]);
 for(let i=0;i<res.length;i++){
   const p0=res[Math.max(0,i-1)],p1=res[Math.min(res.length-1,i+1)];
   const lat=res[i][1];
   const mx=111320*Math.cos(lat*Math.PI/180),my=111320;
   const vx=(p1[0]-p0[0])*mx,vy=(p1[1]-p0[1])*my;
   const len=Math.hypot(vx,vy)||1;
   const nx=-vy/len,ny=vx/len;
   res[i]=[res[i][0]+nx*meters/mx,res[i][1]+ny*meters/my];
 }
 return res;
}

function buildCityMap(){
 const map=new AMap.Map('map-city',{viewMode:'2D',zoom:12,center:[120.355,36.064]});
 (window.__MAPS=window.__MAPS||[]).push(map);
 const overlays=[];
 const walker=new AMap.Walking({});
 const transfer=new AMap.Transfer({city:'青岛'});
 function addLine(path,color){
   const o=new AMap.Polyline({path:path.map(c=>new AMap.LngLat(c[0],c[1])),
     strokeColor:color,strokeWeight:4,strokeOpacity:.92,zIndex:20,lineJoin:'round'});
   o.setMap(map);overlays.push(o);
 }
 map.on('complete',()=>{
  [0,1,3,5,6].forEach(di=>{
   const d=DAYS[di];
   d.stops.forEach(s=>{
     if(s.n==null)return;
     const mk=new AMap.Marker({position:s.pos,offset:new AMap.Pixel(-12,-12),zIndex:60,
       content:'<div class="num" style="background:'+d.c+'">'+s.n+'</div>',clickable:false});
     mk.setMap(map);overlays.push(mk);
   });
  });
  (async()=>{
   for(const di of [0,1,3,5,6]){
     const d=DAYS[di];
     const off=di===3?13:di===5?-13:0;
     for(let i=0;i<d.stops.length-1;i++){
       const a=d.stops[i].pos,b=d.stops[i+1].pos;
       if(d.stops[i].mode==='metro'){
         const paths=await metroRoute(transfer,a,b);
         if(paths)paths.forEach(p=>addLine(nudge(p,off),d.c));else addLine(nudge([a,b],off),d.c);
       }else{
         const p=await walkRoute(walker,a,b);
         if(p){addLine(nudge(p,off),d.c);}
         else if(d.stops[i].fbManual){addLine(nudge(d.stops[i].fbManual,off),d.c);}
         else {addLine(nudge([a,b],off),d.c);}
       }
     }
   }
   map.setFitView(overlays,false,[40,40,40,40]);
   markDone('__CITY_DONE');
  })();
 });
}

 const d=DAYS[2];
 const stops=d.stops.slice(1);
 const overlays=[];
 const walker=new AMap.Walking({});
 map.on('complete',()=>{
  stops.forEach(s=>{
   const mk=new AMap.Marker({position:s.pos,offset:new AMap.Pixel(-12,-12),zIndex:60,
     content:'<div class="num" style="background:'+d.c+'">'+s.n+'</div>',clickable:false});
   mk.setMap(map);overlays.push(mk);
  });
  (async()=>{
   for(let i=0;i<stops.length-1;i++){
     const a=stops[i].pos,b=stops[i+1].pos;
     const p=await walkRoute(walker,a,b);
     const o=new AMap.Polyline({path:(p||[a,b]).map(c=>new AMap.LngLat(c[0],c[1])),
       strokeColor:d.c,strokeWeight:4,strokeOpacity:.92,zIndex:20,lineJoin:'round'});
     o.setMap(map);overlays.push(o);
     slog('H '+i+(p?(' '+p.length):' FB'));
   }
   map.setFitView(overlays,false,[40,40,40,40]);
   markDone('__HD_DONE');
  })();
 });
}
