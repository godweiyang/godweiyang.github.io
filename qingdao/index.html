<style>
:root{
  --sea:#0b4f6c;--sea-2:#12718f;--sea-3:#1b8aa8;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    radial-gradient(1000px 640px at 4% -8%,rgba(64,150,190,.28),transparent 60%),
    radial-gradient(900px 600px at 100% 0%,rgba(120,200,220,.24),transparent 58%),
    linear-gradient(180deg,#eef5f7,#e7f0f4 55%,#e4eef2);
  background-attachment:fixed;min-height:100vh;
}
img{display:block}
.wrap{max-width:1680px;margin:0 auto;padding:26px 22px 70px}
@media(min-width:1900px){.wrap{max-width:1820px}}

/* ===== Hero ===== */
.hero{
  position:relative;overflow:hidden;border-radius:26px;color:#fff;
  background:linear-gradient(135deg,#08405a 0%,var(--sea) 48%,var(--sea-3) 100%);
  padding:44px 48px 38px;box-shadow:0 24px 60px -26px rgba(8,64,90,.65);
}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:150px;bottom:-130px;width:260px;height:260px;
  border-radius:50%;background:rgba(255,255,255,.07)}
.hero h1{margin:0;font-size:clamp(26px,3.6vw,46px);font-weight:800;letter-spacing:2px}
.hero .meta{margin-top:14px;font-size:clamp(14px,1.5vw,19px);opacity:.95;line-height:1.9}
.legend{margin-top:20px;display:flex;gap:22px;flex-wrap:wrap;font-size:clamp(12.5px,1.3vw,16px)}
.legend .k{display:inline-flex;align-items:center;gap:9px}
.kl{width:34px;height:7px;border-radius:4px}

/* ===== Sticky day nav ===== */
.daynav{
  position:sticky;top:10px;z-index:50;margin:18px 0 4px;
  display:flex;gap:10px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;
  background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:999px;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 10px 30px -16px rgba(11,79,108,.4);
}
.daynav::-webkit-scrollbar{display:none}
.daynav a{
  flex:0 0 auto;text-decoration:none;color:var(--sea);font-weight:700;font-size:13.5px;
  padding:7px 16px;border-radius:999px;transition:background .15s,color .15s;
}
.daynav a:hover{background:rgba(11,79,108,.1)}
.daynav a b{font-weight:800}

/* ===== Day card ===== */
.day{
  margin-top:22px;background:var(--card);border-radius:24px;overflow:hidden;
  box-shadow:var(--sh);border:1px solid rgba(255,255,255,.7);
  display:grid;grid-template-columns:clamp(330px,27%,470px) 1fr;
}
.info{padding:28px 30px 22px;display:flex;flex-direction:column;min-width:0}
.dtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ddate{
  flex:0 0 auto;background:var(--sea);color:#fff;font-weight:800;border-radius:14px;
  padding:8px 16px;font-size:21px;text-align:center;line-height:1.25;
}
.ddate small{display:block;font-size:13px;font-weight:500;opacity:.85}
.dtheme{font-size:clamp(19px,1.9vw,27px);font-weight:800;flex:1;min-width:120px}
.dtime{flex:0 0 auto;font-size:13.5px;color:#b3541e;background:#fdeee2;border-radius:999px;
  padding:6px 14px;font-weight:700;white-space:nowrap}
.tl{margin-top:16px;flex:1}
.ti{display:flex;gap:13px;align-items:flex-start;padding:5px 0}
.n{
  flex:0 0 32px;width:32px;height:32px;border-radius:50%;margin-top:2px;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  background:var(--walk);border:2.5px solid #fff;box-shadow:0 0 0 2px #b7d2e4;

.n.start{background:#e8533f;box-shadow:0 0 0 2px #f0b3a8}
.n.end{background:var(--bike);box-shadow:0 0 0 2px #f3d3a0}
.txt{font-size:clamp(14px,1.35vw,18px);line-height:1.45;color:var(--ink-2);padding-top:4px}
.txt b{color:var(--sea);font-weight:700}
.txt .mut{color:var(--sub);font-size:.92em}
.tags{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}

.tag.alt{color:#7a5a12;background:#f7efd8}

.mapwrap{position:relative;min-height:540px;background:#dfe9ee}
.amap{width:100%;height:100%}
.mapbadge{
  position:absolute;left:14px;bottom:14px;z-index:5;pointer-events:none;

.tips{

.tips h3{margin:0;font-size:19px;font-weight:800;color:#8a5a12}
.tips ul{margin:12px 0 0;padding:0}

.tips li::before{content:"";position:absolute;left:5px;top:13px;width:12px;height:12px;border-radius:50%;background:#e8a33c}
.foot{text-align:center;color:#5a7184;font-size:13.5px;margin-top:26px}

/* ===== Mobile ===== */
@media(max-width:900px){

  .info{padding:22px 20px 16px}

/* ===== Lazy map init ===== */
const COLOR = { walk:'#1f6fb2', bike:'#ee9b22' };

function initDay(i){
  const cfg = DAYS[i];
  const map = new AMap.Map('map'+i, { zoom:12, center:cfg.center, viewMode:'2D' });
  const walking = new AMap.Walking({});
  const driving = new AMap.Driving({});
  const markers = [];

  function draw(path,color,dashed,arrows){
    map.add(new AMap.Polyline({path,strokeColor:color,strokeWeight:6,strokeOpacity:.92,
      lineJoin:'round',lineCap:'round',showDir:!!arrows,
      strokeStyle:dashed?'dashed':'solid'}));
  }

  cfg.stops.forEach((s,k)=>{
    let bg = k===0 ? '#e8533f' : (k===cfg.stops.length-1 ? '#ee9b22' : '#1f6fb2');
    const mk = new AMap.Marker({position:s.pos, anchor:'center', zIndex:120,
      content:'<div style="width:30px;height:30px;border-radius:50%;background:'+bg+
      ';border:2.5px solid #fff;box-sizing:border-box;box-shadow:0 1px 6px rgba(0,0,0,.35);'+
      'display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700">'+
      (k+1)+'</div>'});
    map.add(mk); markers.push(mk);
  });

  function enginePath(eng,o,d){
    return new Promise(res=>{
      eng.search(o,d,(status,result)=>{
        let seg=null;
        if(status==='complete'&&result.routes&&result.routes.length){
          seg=[];
          result.routes[0].steps.forEach(st=>{
            if(st.path) st.path.forEach(p=>seg.push([p.lng,p.lat]));
          });
        }
        res(seg&&seg.length?seg:null);
      });
    });
  }

  async function plan(k){
    if(k>=cfg.stops.length-1){ finish(); return; }
    const a=cfg.stops[k], b=cfg.stops[k+1];
    const o=a.gate||a.pos, d=b.gate||b.pos, mode=a.mode;
    if(mode==='metro'){
      draw([o,d],'#d64545',true,false);
    } else if(mode==='bus'){
      if(a.manual){ draw(a.manual,'#2e9e5b',false,false); }
      else {
        let seg=await enginePath(driving,o,d);
        draw(seg||[o,d],'#2e9e5b',false,false);
      }
    } else {
      let seg=await enginePath(walking,o,d);
      if(!seg) seg=await enginePath(driving,o,d);
      draw(seg||[o,d],COLOR[mode]||'#1f6fb2',false,mode==='walk');
    }
    setTimeout(()=>plan(k+1),140);
  }

  function finish(){
    cfg.stops.forEach(s=>{
      if(s.gate && (s.gate[0]!==s.pos[0]||s.gate[1]!==s.pos[1])){
        draw([s.gate,s.pos],'#8a7a5a',true,false);
      }
    });
    const fitM = cfg.fit ? cfg.fit.map(k=>markers[k]) : markers;
    map.setFitView(fitM,false,[50,50,50,50],16);
  }

  map.on('complete',()=>plan(0));
}

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i = +e.target.id.replace('day','');
      initDay(i);
      io.unobserve(e.target);
    }
  });
},{rootMargin:'300px 0px',threshold:.02});

DAYS.forEach((_,i)=>io.observe(document.getElementById('day'+i)));
</script>
